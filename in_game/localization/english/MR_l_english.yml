 mr_torghut_map_tt: "#Y The road west.#! From Dzungaria across the Urals to the Volga — the last great migration of the steppe."
 mr_dzungar_map_tt: "#Y Dzungaria and the western steppe.#! The ground on which the last nomadic empire is being built."

 # --- Ligdan Khan and the Chahar ---
 mr_steppe.1.title: "The Last Great Khan"
 mr_steppe.1.desc: "Ligdan Khan of the Chahar wears the seal of Chinggis and calls himself lord of all Mongols. Few of them agree.\n\nHe has the bloodline and the seal, and almost nothing else — the eastern clans drift toward the rising Manchu power in Mukden, and the western Oirats never accepted Borjigin supremacy in the first place. He intends to compel them all. The question is whether a claim can outlive the horsemen willing to enforce it."
 mr_steppe.1.historical_info: "Ligdan Khan (r. 1604-1634) was the last Great Khan of the Mongols descended from Chinggis. His attempts to reunify the clans by force pushed most of them to ally with the Manchus instead. He died of smallpox fleeing west in 1634, and his son surrendered the imperial seal to Hong Taiji the following year."
 mr_steppe.1.a: "The seal of Chinggis compels obedience."
 mr_steppe.1.b: "A claim is worth what our riders can enforce."

 mr_steppe.2.title: "The Emperor in a Tent"
 mr_steppe.2.desc: "Word has come from the south that the Son of Heaven himself is a prisoner in a Mongol camp. The Ming court is paralysed, its generals discredited, its frontier garrisons leaderless.\n\nWhatever else is true of the settled empires, they are not invulnerable. Every chieftain who hesitated to ride with us has heard the same news."
 mr_steppe.2.historical_info: "At Tumu in 1449 the Oirat leader Esen Taishi destroyed a Ming army and captured the Zhengtong Emperor. The Ming enthroned his brother rather than pay, and Esen eventually released the emperor for nothing."
 mr_steppe.2.a: "Then the walls can be broken after all."

 mr_steppe.3.title: "The Seal Changes Hands"
 mr_steppe.3.desc: "The contest for the Mongolian heartland is settled. One banner now flies from the Kherlen to the Gobi, and the clans that spent a generation playing rivals against each other have run out of rivals to play.\n\nWhat that banner does next is the only question left on the steppe."
 mr_steppe.3.historical_info: "In actual history the seal passed to the Manchus in 1635, and the Mongol imperial line ended. The Qing ruled the steppe for the next two and a half centuries."
 mr_steppe.3.a: "The heartland is ours."

 # --- The Torghut Migration ---
 mr_steppe.10.title: "The Road West"
 mr_steppe.10.desc: "The Torghut clans have had enough of Dzungaria. The pastures are contested, the Khoshut press from one side and the Choros from the other, and to the west there is a great river valley that no horde has held since Sarai fell.\n\nTheir chief speaks of loading the carts and not stopping until the grass changes. It is two thousand miles. It has been done before, in the other direction."
 mr_steppe.10.historical_info: "Between 1616 and 1630 roughly 200,000 Torghut Kalmyks migrated from Dzungaria to the lower Volga, one of the last great steppe migrations. They established a khanate on Russia's southern flank that lasted until 1771, when most of them attempted the return journey."
 mr_steppe.10.a: "Load the carts. We ride until the grass changes."
 mr_steppe.10.b: "Let them go. The pastures will be quieter."

 mr_steppe.11.title: "Across the Urals"
 mr_steppe.11.desc: "The column has crossed the stone belt. Behind it lies Dzungaria and the quarrels it was leaving; ahead lie the salt steppes and, beyond them, the river.\n\nRussian outposts watch the passage and send riders north with the news. Nobody moves to stop it. Nobody is quite sure how."
 mr_steppe.11.historical_info: "The migration route ran north of the Aral Sea and across the Kazakh steppe. The Kazakhs and Nogais resisted the passage; Russia, whose frontier forts were thin on the ground, mostly recorded it."
 mr_steppe.11.a: "The stone belt is behind us."

 mr_steppe.12.title: "Horsemen on the Volga"
 mr_steppe.12.desc: "Our southern voivodes report a nation on the move — not a raid, not a war band, but carts, herds, women and children, tens of thousands of them, settling onto pasture we had begun to think of as ours.\n\nThey came from the east, as such things always do. The last time this happened the reckoning lasted two hundred and forty years."
 mr_steppe.12.historical_info: "Russia ultimately accommodated the Kalmyks, granting them the Volga pastures in exchange for military service against the Crimean Tatars and Ottomans. Kalmyk cavalry fought in Russian armies through to the Napoleonic wars."
 mr_steppe.12.a: "Raise the frontier levies. This will not be a second yoke."
 mr_steppe.12.b: "Better such horsemen serving us than raiding us."

 mr_steppe.13.title: "The Grass Has Changed"
 mr_steppe.13.desc: "The carts have stopped. The herds are on the Volga pasture, the felt tents are up, and for the first time since Sarai burned there is a Mongol power camped on a European river.\n\nThe elders say the ancestors rode this way once and turned back at the wrong moment. This time nobody is turning back."
 mr_steppe.13.historical_info: "The Kalmyk Khanate on the Volga endured from the 1630s to 1771. It was the westernmost Mongol state ever established, and the only one to survive into the modern era — their descendants remain in Kalmykia today, Europe's only Buddhist-majority region."
 mr_steppe.13.a: "Pitch the tents. We are home."

 # --- The Dzungar Khanate ---
 mr_steppe.20.title: "The Choros Ascendant"
 mr_steppe.20.desc: "With the Torghuts gone west and the Khoshut drawn south into Tibet, the Choros are left holding Dzungaria alone — and find that they prefer it.\n\nErdeni Batur is building something the steppe has not seen in three centuries: a khanate with fixed towns, cast cannon, a written code of law, and a standing army that does not disperse after the campaigning season."
 mr_steppe.20.historical_info: "Erdeni Batur founded the Dzungar Khanate around 1634 and convened the 1640 assembly that produced the Mongol-Oirat Code. The Dzungars were the last nomadic empire to seriously threaten a settled great power, holding out against the Qing until their destruction in 1755-58."
 mr_steppe.20.a: "The last horde will not be a horde at all."

 mr_steppe.21.title: "Cannon on the Steppe"
 mr_steppe.21.desc: "The foundries at Kobdo are casting guns, and Swedish and Russian deserters are teaching our smiths to bore them true. The Tarim oases pay grain, the caravan routes pay silver, and both together pay for powder.\n\nOur ancestors won with the bow because nothing on earth could answer it. That advantage is gone. This one we had to build."
 mr_steppe.21.historical_info: "The Dzungars manufactured their own gunpowder weapons, aided by a captured Swedish artilleryman, Johan Gustaf Renat. They were the only steppe power ever to industrialise its own firearms production."
 mr_steppe.21.a: "Let the foundries run day and night."

 mr_steppe.22.title: "The Last Steppe Empire"
 mr_steppe.22.desc: "From the Tarim to the western steppe, one authority holds — with laws written down, taxes counted, garrisons that stay put, and artillery that answers artillery.\n\nThe age of the horse archer is over everywhere. Here, alone, the steppe has survived its ending by becoming something else."
 mr_steppe.22.historical_info: "At its height the Dzungar Khanate controlled Dzungaria, the Tarim Basin, and much of the Kazakh steppe. Its destruction by the Qianlong Emperor in 1755-58 was so complete that historians describe it as genocide, and it marked the definitive end of nomadic power in Eurasia."
 mr_steppe.22.a: "The steppe endures, in a new shape."
