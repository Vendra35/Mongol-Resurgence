 # --- IMPERIAL CONQUEST EVENTS ---
 mr_imperial.100.title: "The Invasion Plans"
 mr_imperial.100.desc: "Our scouts have returned with detailed maps of our target's defenses. We know where their armies are weak, where their walls are thin, and where their people are most vulnerable. The time has come to draw up the final invasion plans."
 mr_imperial.100.a: "Mark the targets!"

 mr_imperial.101.title: "The First Wave"
 mr_imperial.101.desc: "Our initial assaults have struck with devastating force. The enemy's border defenses have crumbled, and our advance units are already deep in their territory. The second wave must follow quickly to exploit the breach before they can regroup."
 mr_imperial.101.a: "Send the second wave!"

 mr_imperial.102.title: "The City Falls"
 mr_imperial.102.desc: "One of the enemy's great cities has fallen! Our warriors have breached the walls after a brutal siege, and the defenders have surrendered. The treasures of the city are ours, and its strategic position will serve as our forward base for the next phase of the invasion."
 mr_imperial.102.a: "Strip it of everything valuable!"

 mr_imperial.103.title: "The Counter-Attack"
 mr_imperial.103.desc: "The enemy has rallied! Our overextended forces have been hit by a desperate counter-attack. Our advance has been halted, and several forward units are in danger of being cut off. We must either commit our reserves or risk losing everything we've gained."
 mr_imperial.103.a: "Hold the line! Send reinforcements!"
 mr_imperial.103.b: "Fall back to defensible positions."

 # --- STAGE 2 VICTORY EVENTS ---
 mr_imperial.200.title: "The Empire Secured"
 mr_imperial.200.desc: "The campaign has ended in total victory! Our enemies have been crushed, their capitals sacked, and their rulers brought before us in chains. The Mongol Empire now controls territory our ancestors never dreamed of. This is the beginning of our golden age."
 mr_imperial.200.a: "The empire is secure!"

 mr_imperial.201.title: "A New Empire Rises"
 mr_imperial.201.desc: "News spreads across the world: the Mongol horde has triumphed. Ancient kingdoms have fallen, and a new imperial power bestrides Asia like a colossus. Foreign courts tremble at the mention of the Great Khan's name, and emissaries from distant lands seek our favor."
 mr_imperial.201.a: "Let them come and pay tribute!"

 mr_imperial.202.title: "The Grand Review"
 mr_imperial.202.desc: "With the conquest complete, we hold a grand review of our victorious armies. Regiment after regiment of elite cavalry passes before the Great Khan, their banners fluttering in the wind, their armor gleaming, and their discipline a testament to the new Mongol military order."
 mr_imperial.202.a: "A sight to inspire generations!"

 # --- STAGE 2 FAILURE EVENTS ---
 mr_imperial.210.title: "The Campaign Stalls"
 mr_imperial.210.desc: "Our advance has ground to a halt. The enemy has adapted to our tactics, their defenses have stiffened, and our supply lines are stretched to breaking point. The dream of a vast Mongol empire is fading with each day of stalemate."
 mr_imperial.210.a: "We underestimated them."

 mr_imperial.211.title: "The Retreat from the West"
 mr_imperial.211.desc: "The campaign has become untenable. Our forces are being pushed back on all fronts, and every mile we retreat is a mile of conquered territory lost. The settled peoples have proven their resilience, and the Great Khan's ambition has been checked by the realities of war."
 mr_imperial.211.a: "A painful lesson."

 # ==============================================================================
 # ----------------- STAGE 3 DOMINANCE EVENTS -----------------
 # ==============================================================================

 mr_dominance_stage3.100.title: "The Imperial Census"
 mr_dominance_stage3.100.desc: "To govern effectively, we must know exactly what we rule. A comprehensive census shall be conducted across all our territories, cataloging populations, resources, and productive capacity. This knowledge will form the foundation of our imperial administration."
 mr_dominance_stage3.100.a: "Count every subject, every sheep, every coin."

 mr_dominance_stage3.101.title: "The Great Code of Laws"
 mr_dominance_stage3.101.desc: "A unified empire requires unified laws. Our scholars and judges have compiled a comprehensive legal code based on Mongol traditions, adapted to govern our diverse subject peoples. From this day forward, all shall be judged by the same imperial law."
 mr_dominance_stage3.101.a: "Let justice flow from the Khan's throne."

 mr_dominance_stage3.102.title: "The Imperial Treasury"
 mr_dominance_stage3.102.desc: "The wealth of conquered nations now flows into our imperial treasury. Our administrators have established efficient tax collection systems, and the tributes from subject kingdoms fill our coffers. We must decide how to invest this unprecedented wealth."
 mr_dominance_stage3.102.a: "Build monuments worthy of our glory!"

 mr_dominance_stage3.103.title: "Religious Harmony"
 mr_dominance_stage3.103.desc: "Our empire encompasses peoples of many faiths: Buddhists, Muslims, Christians, and followers of the old steppe traditions. The Great Khan has always practiced tolerance, and now we shall enshrine it as imperial policy. Let all worship as they choose, so long as they remain loyal."
 mr_dominance_stage3.103.a: "The Khan protects all faiths."

 mr_dominance_stage3.200.title: "The Pax Mongolica"
 mr_dominance_stage3.200.desc: "Peace has been established across the empire. Trade flourishes, cultures mingle, and a new era of stability has dawned. The Pax Mongolica is not merely the absence of war; it is the active prosperity that comes from our rule. Merchants travel safely from one end of the empire to the other, and our subjects enjoy a standard of living unknown in past generations."
 mr_dominance_stage3.200.a: "A golden age for all under Mongol rule!"

 mr_dominance_stage3.201.title: "The Khan's Legacy"
 mr_dominance_stage3.201.desc: "Our life's work is complete. The Mongol people have been transformed from scattered tribes into the masters of the greatest empire the world has ever seen. Future generations will look back on this era as the moment when history itself was reshaped. The Great Khan's name will echo through eternity."
 mr_dominance_stage3.201.a: "We have earned our place in the eternal blue sky."

 mr_dominance_stage3.210.title: "The Seeds of Decline"
 mr_dominance_stage3.210.desc: "Cracks are appearing in our imperial edifice. Provincial governors grow corrupt, subject peoples whisper of rebellion, and the unity of purpose that drove our conquests has faded. The challenge of maintaining our empire may prove greater than the challenge of building it."
 mr_dominance_stage3.210.a: "The rot must be cut out."

 mr_dominance_stage3.211.title: "The Collapse"
 mr_dominance_stage3.211.desc: "It is over. The strains of empire have proved too great, and our once-mighty dominion is crumbling. Subject peoples declare independence, our armies mutiny, and the Great Khan's authority evaporates. The Mongol Empire passes into history, a brilliant but brief flame that illuminated and then scorched the world."
 mr_dominance_stage3.211.a: "Even the eternal blue sky fades."

