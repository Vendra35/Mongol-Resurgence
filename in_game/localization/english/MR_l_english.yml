l_english:

 # ==============================================================================
 # ----------------- SITUATION 1: MONGOL RESURGENCE -----------------
 # ==============================================================================

 # --- SITUATION NAME & DESC ---
 situation_mongol_resurgence_title: "Mongol Resurgence"
 situation_mongol_resurgence_desc: "The old steppe has gone silent. The once-mighty hordes that thundered across continents have been reduced to scattered tribes, bickering over pastures and petty alliances. The warrior spirit of Chinggis Khaan seems lost to the winds.\n\nBut in this chaos lies opportunity. One ambitious leader can rise from obscurity, unite the warring clans, and remind the world why their ancestors once trembled at the sound of hoofbeats. The road to empire begins with a single tent, a single banner, and a single will to dominate.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nThis situation depicts the chaotic struggle for dominance among the fractured Mongol successor states. Historically, the Mongol Empire fragmented after the death of Möngke Khaan in 1259, leading to centuries of internal strife and external pressures. A new unification will require crushing rival khans, absorbing their hordes, and proving absolute supremacy on the steppe.\n\n#Y What to Expect:#! The AI will opportunistically target weaker rival khans, building up its military might and tribal authority. Expect calculated wars of unification rather than mindless blobbing. The victor will emerge as the undisputed master of the Mongolian heartland, ready to look beyond the steppe."


 # --- TOOLTIPS ---
 mongol_resurgence_target_score_tooltip: "Dominance Score (Mongol Resurgence)"
 mongol_resurgence_progress_tooltip: "Unification Progress"
 mongol_resurgence_end_requirements_tooltip: "Unification Conditions"

 # --- ACTION ---
 mongol_resurgence_emerge_action: "Rise from the Steppe"

 # --- ICON ---
 gfx_interface_situation_mongol_resurgence: "gfx/interface/situations/situation_mongol_resurgence.dds"

 # --- CONTENDERS ---
 MR_MGO_SCORE_TT: "Score: [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('MR_mgo_score').GetValue|2]"
 MR_MGO_MILITARY_STRENGTH_TT_TITLE: "Mongol Military Strength"
 MR_MGO_SCORE_TT_DESC: "Score: Calculated with a weighted formula based on military strength, income, and prestige."

 # --- TARGET LOCATION TT ---
 MR_MONGOL_TARGET_LOCATION_TT: "#Y STRATEGIC OBJECTIVE:#!\nThis location is vital for the Mongol Resurgence. It must be secured and brought under our control."

 # --- WIN CONDITIONS ---
 mongol_resurgence_unite_tribes_tt: "Unite all major Mongol tribes under a single banner, controlling the key steppe territories of [ShowAreaName('mongolia_area')], [ShowAreaName('outer_mongolia_area')], and [ShowAreaName('buryat_area')] or their subjects."
 mongol_resurgence_knockout_tt: "All rival Mongol khans are subjugated, destroyed, or driven from the Mongol heartland."
 mongol_resurgence_time_limit_tt: "The time limit has been reached and the strongest khan will claim dominance by default."

 # --- CB & WAR GOAL ---
 cb_MR_mongol_resurgence: "Mongol Reunification"
 cb_MR_mongol_resurgence_desc: "A war to subjugate rival Mongol khans and reunite the fractured steppe tribes under a single banner.\n\nConquest with this [casus_belli|e] will be limited to Mongol cultural [areas|e]."
 war_goal_MR_mongol_resurgence: "Superiority"
 war_goal_MR_mongol_resurgence_desc: "[war_goal|e] is to win more battles than our enemy."

 # --- MODIFIERS ---
 STATIC_MODIFIER_NAME_MR_mongol_warrior_spirit: "Mongol Warrior Spirit (Terminator)"
 STATIC_MODIFIER_DESC_MR_mongol_warrior_spirit: "The warrior traditions of the steppe are reawakening. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_unified_mongol_banner: "Unified Mongol Banner"
 STATIC_MODIFIER_DESC_MR_unified_mongol_banner: "The clans have been united under a single khan. #color_red (This effect will be removed upon the start of the 2nd Situation.)#!"
 STATIC_MODIFIER_NAME_MR_shattered_horde: "Shattered Horde"
 STATIC_MODIFIER_DESC_MR_shattered_horde: "Our failure to unite the steppe has left us weak and divided."
 STATIC_MODIFIER_NAME_MR_mongol_resurgence_penalty_ai: "Shattered Ambition"
 STATIC_MODIFIER_NAME_MR_mongol_resurgence_penalty_player: "Unfulfilled Destiny"

 # --- HISTORICAL MODIFIERS ---
 STATIC_MODIFIER_NAME_MR_mongol_historical_modifier: "Mongol Awakening"
 STATIC_MODIFIER_DESC_MR_mongol_historical_modifier: "The warrior spirit of the steppe stirs once more. #color_red (This effect will be removed upon the completion of the current Situation.)#!"

 # ==============================================================================
 # ----------------- SITUATION 2: ROAD TO EMPIRE -----------------
 # ==============================================================================

 # --- SITUATION NAME & DESC ---
 situation_mongol_imperial_title: "Road to Empire"
 situation_mongol_imperial_desc: "The steppe is united, but the Mongol destiny demands more. Our ancestors did not stop at the edge of the grasslands; they carved an empire that stretched from the Pacific to the Danube. The world forgot the taste of fear, but we shall remind them.\n\nNow begins the true test. We must transform our tribal confederation into a proper imperial machine, capable of sustained conquest across vast distances. The road ahead is paved with the bones of those who thought themselves safe behind walls and rivers.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nAfter Genghis Khan united the Mongol tribes in 1206, he didn't rest. He immediately turned outward, conquering the Jin Dynasty, the Khwarezmian Empire, and laying the foundation for the largest contiguous land empire in history. Similarly, our unified Mongol state will now look beyond the steppe.\n\n#Y What to Expect:#! The AI will aggressively expand into neighboring regions, prioritizing China, Persia, and the Rus' principalities. Expect large-scale invasions, calculated sieges, and the systematic dismantling of regional powers. The empire that emerges will be a true terror to behold."


 # --- TOOLTIPS ---
 mongol_imperial_target_score_tooltip: "Imperial Ambition Score (Mongol)"
 mongol_imperial_target_score_mge_tooltip: "Imperial Ambition Score (Great Khan)"
 mongol_imperial_progress_tooltip: "Imperial Expansion Progress"
 mongol_imperial_end_requirements_tooltip: "Empire Formation Conditions"

 # --- ACTION ---
 mongol_imperial_conquer_action: "Begin the Conquest"

 # --- ICON ---
 gfx_interface_situation_mongol_imperial: "gfx/interface/situations/situation_mongol_imperial.dds"

 # --- TOOLTIPS FOR TARGETS ---
 MR_MGE_SCORE_TT: "Score: [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('MR_mge_score').GetValue|2]"
 MR_MGE_MILITARY_STRENGTH_TT_TITLE: "Great Khan's Military Strength"
 MR_MGE_SCORE_TT_DESC: "Score: Calculated with a weighted formula based on military strength, income, prestige, and development."

 # --- TARGET LOCATION TT ---
 MR_IMPERIAL_TARGET_LOCATION_TT: "#Y IMPERIAL OBJECTIVE:#!\nThis location must be conquered as part of the Road to Empire."

 # --- WIN CONDITIONS ---
 mongol_imperial_conquer_china_tt: "Conquer the heartlands of [ShowRegionName('north_china_region')] and [ShowRegionName('south_china_region')] or their subjects controlling these areas."
 mongol_imperial_conquer_persia_tt: "Conquer the [ShowRegionName('persia_region')] or its subjects controlling the area."
 mongol_imperial_conquer_rus_tt: "Conquer the [ShowRegionName('rus_region')] principalities or their subjects."
 mongol_imperial_conquer_central_asia_tt: "Control the [ShowRegionName('central_asia_region')] and the Silk Road trade routes."
 mongol_imperial_time_limit_tt: "The time limit has been reached. The empire's expansion phase must conclude."

 # --- CB & WAR GOAL ---
 cb_MR_mongol_imperial: "Mongol Imperial Conquest"
 cb_MR_mongol_imperial_desc: "A war of imperial conquest to expand the Mongol realm across Asia. Our enemies shall either kneel or be crushed beneath our hooves.\n\nConquest with this [casus_belli|e] will target neighboring regions."
 war_goal_MR_mongol_imperial: "Superiority"
 war_goal_MR_mongol_imperial_desc: "[war_goal|e] is to win more battles than our enemy."

 # --- MODIFIERS ---
 STATIC_MODIFIER_NAME_MR_imperial_conquest: "Imperial Conquest (Terminator)"
 STATIC_MODIFIER_DESC_MR_imperial_conquest: "The Mongol war machine is operational and hungry for conquest. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_empire_fulfilled: "Mongol Empire Fulfilled"
 STATIC_MODIFIER_DESC_MR_empire_fulfilled: "Our imperial destiny has been realized. #color_red (This effect will be removed upon the start of the 3nd Situation.)#!"
 STATIC_MODIFIER_NAME_MR_imperial_failure_ai: "Shackled Empire"
 STATIC_MODIFIER_NAME_MR_imperial_failure_player: "Failed Imperial Dream"

 # --- HISTORICAL MODIFIERS ---
 STATIC_MODIFIER_NAME_MR_imperial_historical_modifier: "Imperial Awakening"
 STATIC_MODIFIER_DESC_MR_imperial_historical_modifier: "The Mongol empire expands with historical momentum. #color_red (This effect will be removed upon the completion of the current Situation.)#!"

 # ==============================================================================
 # ----------------- SITUATION 3: MONGOL DOMINANCE -----------------
 # ==============================================================================

 # --- SITUATION NAME & DESC ---
 situation_mongol_dominance_title: "Mongol Dominance"
 situation_mongol_dominance_desc: "The empire stands as the undisputed master of Asia. From the Sea of Japan to the banks of the Volga, the Mongol banner flies unchallenged. But true dominance is not merely holding territory; it is about reshaping the world in our image.\n\nNow the final phase begins. We must consolidate our imperial administration, integrate our diverse conquered peoples, and establish a lasting legacy that will define the world order for centuries. The Mongol Age will not be a brief moment in history; it will be the foundation of a new global civilization.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nAt its height, the Mongol Empire was not just a military machine but an administrative marvel that facilitated trade, religious tolerance, and cultural exchange across Eurasia. The Pax Mongolica connected East and West, and the Yuan Dynasty ruled China as a legitimate imperial power.\n\n#Y What to Expect:#! The AI will focus on internal consolidation, cultural integration, and economic dominance. Expect the establishment of imperial institutions, trade networks, and the final assimilation of conquered peoples into the Mongol imperial identity."


 # --- TOOLTIPS ---
 mongol_dominance_target_score_tooltip: "Dominance Consolidation Score"
 mongol_dominance_progress_tooltip: "Consolidation Progress"
 mongol_dominance_end_requirements_tooltip: "World Order Conditions"

 # --- ACTION ---
 mongol_dominance_consolidate_action: "Establish the New Order"

 # --- ICON ---
 gfx_interface_situation_mongol_dominance: "gfx/interface/situations/situation_mongol_dominance.dds"

 # --- WIN CONDITIONS ---
 mongol_dominance_integrate_tt: "Successfully integrate conquered territories into the imperial administration."
 mongol_dominance_pax_mongolica_tt: "Establish the Pax Mongolica, ensuring stability and trade across the empire."
 mongol_dominance_imperial_legacy_tt: "Found lasting imperial institutions that will survive for generations."
 mongol_dominance_time_limit_tt: "The era of Mongol dominance must be finalized."

 # --- CB & WAR GOAL ---
 cb_MR_mongol_dominance: "Mongol Hegemony"
 cb_MR_mongol_dominance_desc: "A war to enforce Mongol supremacy and dismantle any remaining resistance to the new world order."
 war_goal_MR_mongol_dominance: "Superiority"
 war_goal_MR_mongol_dominance_desc: "[war_goal|e] is to win more battles than our enemy."

 # --- MODIFIERS ---
 STATIC_MODIFIER_NAME_MR_pax_mongolica: "Pax Mongolica (Terminator)"
 STATIC_MODIFIER_DESC_MR_pax_mongolica: "The Mongol peace has been established, bringing stability and prosperity. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_mongol_world_order: "Mongol World Order"
 STATIC_MODIFIER_DESC_MR_mongol_world_order: "The world has been permanently reshaped by Mongol dominance."
 STATIC_MODIFIER_NAME_MR_dominance_failure_ai: "Collapsed Hegemony"
 STATIC_MODIFIER_NAME_MR_dominance_failure_player: "Failed World Order"

 # --- HISTORICAL MODIFIERS ---
 STATIC_MODIFIER_NAME_MR_dominance_historical_modifier: "Mongol Hegemony"
 STATIC_MODIFIER_DESC_MR_dominance_historical_modifier: "The Mongol Empire dominates the world stage. #color_red (This effect will be removed upon the completion of the current Situation.)#!"

 # --- TARGET LOCATION TT ---
 MR_DOMINANCE_TARGET_LOCATION_TT: "#Y IMPERIAL HEARTLAND:#!\nThis location is critical for the Mongol world order."

 # ==============================================================================
 # ----------------- SITUATION EVENTS -----------------
 # ==============================================================================

 # --- EVENT 10: SITUATION STARTER ---
 mr_dominance.10.title: "The Eagle of the Steppe"
 mr_dominance.10.desc: "The struggle for the Mongol destiny has begun! The fractured tribes and khanates of the steppe have entered a period of intense competition. One among them will rise to unite the warring clans and reclaim the glory of Chinggis Khaan. Our warriors are ready, our scouts have mapped the enemy camps, and the time for action is now."
 mr_dominance.10.a: "Let the hooves thunder!"

 # --- EVENT 1: SITUATION VICTORY (MAP PAINTER) ---
 mr_dominance.1.title: "The Rise of the Great Khan"
 mr_dominance.1.desc: "The steppe has chosen its master! Through blood, iron, and unrelenting will, our horde has subjugated all rivals and united the Mongol tribes under a single banner. The days of petty khans and divided pastures are over. A new Great Khan has emerged, and the world shall once again learn to fear the Mongol name.\n\nFrom the Altai Mountains to the Gobi Desert, the clans now ride as one. But this is merely the beginning. Our ancestors conquered half the known world. We shall finish what they started."
 mr_dominance.1.a: "The world is ours to conquer!"

 # --- EVENT 2: FAILED SITUATION (PLAYER LOST) ---
 mr_dominance.2.title: "The Steppe Remains Divided"
 mr_dominance.2.desc: "Our ambitions lie in ruins. Another khan has claimed dominance over the steppe, and our warriors are scattered to the winds. The dream of a united Mongol nation under our banner is dead. We must accept our diminished place in history and perhaps, one day, a new generation will rise to reclaim what we have lost."
 mr_dominance.2.a: "We will endure, as the steppe always does."

 # --- EVENT 100: ISOLATING TARGET ---
 mr_dominance.100.title: "Gathering the Horde"
 mr_dominance.100.desc: "Before we can strike at our rivals, we must consolidate our own forces. The scattered tribes and clans must be rallied to our banner. Our diplomats ride to every camp, offering a simple choice: join us willingly or face the consequences after our victory."
 mr_dominance.100.a: "Summon every warrior!"

 # --- EVENT 101: OBSERVER NOTIFICATION ---
 mr_dominance.101.title: "The Steppe Stirs"
 mr_dominance.101.desc: "Reports from the Mongol heartland indicate a major power struggle is underway. Tribes are abandoning their ancestral pastures, alliances are being forged and broken with alarming speed, and the thunder of massing cavalry can be heard across the grasslands. A new power is rising on the steppe."
 mr_dominance.101.a: "We shall watch closely."

 # --- EVENT 102: TARGET WARNING ---
 mr_dominance.102.title: "The Shadow of the Khan"
 mr_dominance.102.desc: "Ominous news from the steppe! A rival khan has been gathering unprecedented support among the tribes. Their warriors outnumber ours, and their scouts have been spotted near our borders. It is clear they intend to challenge us for supremacy. We must prepare our defenses or risk being swept away by the coming storm."
 mr_dominance.102.a: "We will not be conquered!"

 # --- EVENT 103: WAR DECLARATION ---
 mr_dominance.103.title: "The Thunder of Hooves"
 mr_dominance.103.desc: "The preparations are complete. Our warriors have gathered from every corner of the steppe, their horses restless and their blades sharp. The time has come to strike at our rival and claim our rightful place as the sole power of the Mongol nation. Let our enemies tremble!"
 mr_dominance.103.a: "Charge! For the glory of the Khan!"
 mr_dominance.103.b: "Wait... we are not ready yet. (Postpone for 10 years)"

 # --- EVENT 104: OBSERVER VICTORY ---
 mr_dominance.104.title: "A New Khan Rises"
 mr_dominance.104.desc: "The power struggle on the steppe has reached its conclusion. A new Great Khan has emerged victorious, having crushed all rivals and united the Mongol tribes under a single war banner. The balance of power in Asia has been fundamentally altered, and the established empires beyond the steppe must now reckon with a resurgent Mongol threat."
 mr_dominance.104.a: "They grow stronger by the day."

 # --- EVENT 105: PLAYER VICTORY ---
 mr_dominance.105.title: "Victory on the Steppe"
 mr_dominance.105.desc: "The enemy lies broken beneath our horses' hooves! Our rival khan has been decisively defeated, their warriors scattered, and their lands absorbed into our growing domain. The steppe now recognizes only one master, and the path to greater conquests lies open before us."
 mr_dominance.105.a: "A glorious day for the Mongol people!"

 # --- EVENT 107: PLAYER DEFEAT ---
 mr_dominance.107.title: "Scattered to the Winds"
 mr_dominance.107.desc: "Disaster! Our forces have been routed, our warriors flee in disarray, and our rival has proven the stronger. The campaign has ended in humiliating defeat. Our prestige is shattered, and many of the tribes that swore allegiance to us now abandon our banner. We must retreat and lick our wounds."
 mr_dominance.107.a: "We will remember this shame."

 # --- EVENT 120: SITUATION 2 STARTER ---
 mr_dominance.120.title: "Beyond the Steppe"
 mr_dominance.120.desc: "The steppe is united under our banner, but the Mongol destiny demands more. The great empires beyond our borders are wealthy, decadent, and ripe for conquest. Our scouts report that the settled peoples have grown soft behind their walls. They have forgotten what it means to face the Mongol horde. It is time to remind them.\n\nThe Road to Empire begins now."
 mr_dominance.120.a: "Point us toward the richest lands!"

 # --- EVENT 121: OBSERVER SITUATION 2 START ---
 mr_dominance.121.title: "The Mongol Awakening"
 mr_dominance.121.desc: "Having secured dominance over the steppe, the unified Mongol nation is now turning its gaze outward. Mass mobilization is underway, and the great khans speak openly of resurrecting the empire of Chinggis. The settled civilizations bordering the grasslands prepare nervously for what may come."
 mr_dominance.121.a: "The storm approaches."

 # --- EVENT 122: SITUATION 2 TARGET WARNING ---
 mr_dominance.122.title: "The Horde at the Gates"
 mr_dominance.122.desc: "Our worst fears have materialized. The Mongol horde has been sighted massing on our borders, their numbers beyond counting. The steppe tribes have united under a single Great Khan, and their eyes are fixed hungrily upon our lands. We must rally every soldier we have or face annihilation."
 mr_dominance.122.a: "Sound the alarm!"

 # --- EVENT 123: SITUATION 2 WAR DECLARATION ---
 mr_dominance.123.title: "The Great Invasion"
 mr_dominance.123.desc: "The time for preparation is over. Our horde stands ready, a sea of warriors stretching to the horizon. The walls of our enemies will crumble, their armies will scatter, and their treasures will fill our carts. The Mongol Empire rises today!"
 mr_dominance.123.a: "Let the conquest begin!"
 mr_dominance.123.b: "We need more time to gather our full strength... (Postpone for 5 years)"

 # --- EVENT 124: SITUATION 2 VICTORY ---
 mr_dominance.124.title: "The Empire Rises"
 mr_dominance.124.desc: "Our armies have swept across the continent like a divine wind. Cities that had stood for centuries have fallen, empires that thought themselves eternal have crumbled, and the Mongol banner now flies over lands our ancestors could only dream of. The Road to Empire has reached its glorious destination."
 mr_dominance.124.a: "The world kneels before the Great Khan!"

 # --- EVENT 125: OBSERVER SITUATION 2 VICTORY ---
 mr_dominance.125.title: "The Mongol Tide"
 mr_dominance.125.desc: "The unthinkable has occurred. The unified Mongol horde has emerged victorious from its campaign of conquest, carving out an empire of staggering proportions. Ancient kingdoms have been reduced to vassals, and the map of Asia has been permanently redrawn by the sword. The era of Mongol dominance has begun."
 mr_dominance.125.a: "The balance of power is shattered."

 # --- EVENT 127: SITUATION 2 PLAYER DEFEAT ---
 mr_dominance.127.title: "The Tide Recedes"
 mr_dominance.127.desc: "Our great campaign has failed. The settled peoples proved more resilient than we anticipated, their walls held firm, and their armies fought with desperation born of defending their homes. Our horde has been repelled, and the dream of a new Mongol Empire lies in ruins. We must retreat to the steppe and rebuild."
 mr_dominance.127.a: "A bitter retreat."

 # --- EVENT 130: SITUATION 3 STARTER ---
 mr_dominance.130.title: "The Mongol Age"
 mr_dominance.130.desc: "Our empire now stretches across continents, encompassing peoples of countless tongues and traditions. But conquest alone is not enough. To create a legacy that will endure for a thousand years, we must transform our war machine into an imperial civilization. The conquered must be integrated, the trade routes secured, and a new world order established with the Great Khan at its center."
 mr_dominance.130.a: "Let the new era begin!"

 # --- EVENT 131: OBSERVER SITUATION 3 START ---
 mr_dominance.131.title: "The New World Order"
 mr_dominance.131.desc: "Having conquered vast territories across Asia, the Mongol Empire is now consolidating its gains. Trade routes are being reorganized, imperial bureaucracies established, and the diverse peoples of the conquered lands are being systematically integrated into the Mongol imperial system. A new era of global politics is dawning."
 mr_dominance.131.a: "The world will never be the same."

 # --- EVENT 132: SITUATION 3 VICTORY ---
 mr_dominance.132.title: "The Eternal Empire"
 mr_dominance.132.desc: "It is done. The Mongol Empire has been transformed from a conquering horde into a permanent imperial civilization. Our institutions are robust, our trade networks span the known world, and the diverse peoples under our rule have been bound together into a single imperial identity. The Great Khan's legacy will echo through the ages, and the Mongol Age will never truly end."
 mr_dominance.132.a: "We have built something eternal."

 # --- EVENT 133: SITUATION 3 DEFEAT ---
 mr_dominance.133.title: "The Empire Crumbles"
 mr_dominance.133.desc: "Our imperial project has failed. The strains of governing such a vast and diverse empire proved too great. Corruption spreads through our administration, conquered peoples rise in rebellion, and our once-unstoppable military has grown complacent. The dream of a lasting Mongol world order slips through our fingers."
 mr_dominance.133.a: "All empires fall eventually."

 # ==============================================================================
 # ----------------- DHE EVENTS (Dynamic Historical Events) -----------------
 # ==============================================================================

 # --- DHE 1: Military Transformation ---
 mr_dominance_dhe.1.title: "The Forge of Warriors"
 mr_dominance_dhe.1.entry: "(MR) - The Forge of Warriors (AI Only)"
 mr_dominance_dhe.1.desc: "The old ways of tribal warfare will no longer suffice. To conquer the settled empires, we must transform our warriors into a disciplined military machine. Our smiths will forge better weapons, our trainers will drill the horde into coordinated units, and our tacticians will study the defensive weaknesses of our enemies."
 mr_dominance_dhe.1.a: "Forge the weapon that will conquer the world!"
 mr_dominance_dhe.1.a.tt1: "We will research the [ShowAdvanceName('mongol_military_advance')] [advance|e] for free."
 mr_dominance_dhe.1.a.tt2: "Military infrastructure will be expanded in our capital:"
 mr_dominance_dhe.1.a.tt3: "Military buildings will be constructed for free. A great number of [pops|e] will convert to our [faith|e] and [culture|e], and five regiments of elite horse archers will flock to our banner."
 mr_dominance_dhe.1.a.tt4: "The Mongol Resurgence takes root in our capital."

 # --- DHE 2: Imperial Capital ---
 mr_dominance_dhe.2.title: "The Imperial Encampment"
 mr_dominance_dhe.2.entry: "(MR) - The Imperial Encampment (AI Only)"
 mr_dominance_dhe.2.desc: "Our capital must become worthy of a Great Khan. No longer a mere encampment, it shall be transformed into the political and military heart of our growing empire. From here, our commands will reach every corner of the steppe and beyond. The great tents of our generals, the forges of our smiths, and the training grounds of our warriors will make this the most formidable military center in the world."
 mr_dominance_dhe.2.a: "Let the world see our power!"
 mr_dominance_dhe.2.a.tt1: "We will research the [ShowAdvanceName('mongol_command_advance')] [advance|e] for free."
 mr_dominance_dhe.2.a.tt2: "The capital's military infrastructure will be modernized:"
 mr_dominance_dhe.2.a.tt3: "Military buildings will be constructed for free. A great number of [pops|e] will convert to our [faith|e] and [culture|e], and eight elite cavalry regiments will reinforce our horde."
 mr_dominance_dhe.2.a.tt4: "The imperial road begins here."

 # --- DHE 3: Siege Warfare ---
 mr_dominance_dhe.3.title: "The Wall Breakers"
 mr_dominance_dhe.3.entry: "(MR) - The Wall Breakers (AI Only)"
 mr_dominance_dhe.3.desc: "The great weakness of the settled peoples is their reliance on walls and fortifications. They believe stone can stop the Mongol horde. We will prove them wrong. By incorporating captured siege engineers and developing our own techniques, we will ensure that no city, no matter how well defended, can withstand our assault."
 mr_dominance_dhe.3.a: "No wall shall stand in our path!"
 mr_dominance_dhe.3.a.tt1: "We will research the [ShowAdvanceName('mongol_siege_advance')] [advance|e] for free."
 mr_dominance_dhe.3.a.tt2: "Siege capabilities will be dramatically improved:"
 mr_dominance_dhe.3.a.tt3: "Siege-related buildings will be constructed for free. Our engineers will develop new techniques, and specialist siege regiments will be raised immediately."
 mr_dominance_dhe.3.a.tt4: "The walls of our enemies will crumble."

 # --- DHE 4: Unification Ceremony (for Formation) ---
 mr_dominance_dhe.4.title: "The Kurultai"
 mr_dominance_dhe.4.entry: "(MR) - The Great Kurultai"
 mr_dominance_dhe.4.desc: "The time has come to formalize our supreme authority over all Mongol peoples. A great Kurultai has been called, and chieftains from every corner of the steppe have gathered to acknowledge our dominion. By the ancient traditions, we shall be proclaimed the undisputed Great Khan, and the scattered tribes shall be formally unified into a single, indivisible nation."
 mr_dominance_dhe.4.a: "Let the Kurultai declare our destiny!"

 # --- DHE 5: Integration of Rivals ---
 mr_dominance_dhe.5.title: "The Absorption of the Rival Horde"
 mr_dominance_dhe.5.entry: "(MR) - The Absorption of Rival Hordes (AI Only)"
 mr_dominance_dhe.5.desc: "The time has come to fully integrate our subjugated rival khanates. Their warriors shall be incorporated into our horde, their pastures absorbed into our domain, and their chieftains reduced to loyal commanders under our supreme authority. The era of divided Mongol loyalties ends today."
 mr_dominance_dhe.5.a: "They are Mongols no more. They are ours."

 # --- DHE 6: The Silk Road ---
 mr_dominance_dhe.6.title: "The Silk Road Reborn"
 mr_dominance_dhe.6.entry: "(MR) - The Silk Road Reborn (AI Only)"
 mr_dominance_dhe.6.desc: "The ancient trade routes that once connected the East and West have fallen into disrepair and banditry. Under Mongol rule, we shall restore and protect the Silk Road, turning it into the economic backbone of our empire. Merchants will travel safely under our protection, and the wealth of three continents will flow through our lands."
 mr_dominance_dhe.6.a: "Let the caravans flow!"

 # --- DHE 7: Cultural Integration ---
 mr_dominance_dhe.7.title: "The Imperial Melting Pot"
 mr_dominance_dhe.7.entry: "(MR) - The Imperial Melting Pot (AI Only)"
 mr_dominance_dhe.7.desc: "Our empire now encompasses countless cultures, faiths, and traditions. Rather than suppress this diversity, we shall harness it. The most talented administrators, engineers, and scholars from across our domain shall be brought to the imperial court, creating a sophisticated imperial culture that draws strength from all its peoples."
 mr_dominance_dhe.7.a: "Let knowledge flow to the center!"

 # --- DHE 8: The Yam System ---
 mr_dominance_dhe.8.title: "The Yam Postal Relay"
 mr_dominance_dhe.8.entry: "(MR) - The Yam System (AI Only)"
 mr_dominance_dhe.8.desc: "To govern our vast empire, communication must be swift and reliable. We shall establish the Yam, a system of relay stations across our territory that will allow messengers to cover vast distances at unprecedented speed. Orders from the Great Khan will reach the farthest corners of the empire in days rather than months."
 mr_dominance_dhe.8.a: "Let nothing slow our commands!"

