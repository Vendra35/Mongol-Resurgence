l_english:
 mr_herds.1.title: "Zud — the Killing Winter"
 mr_herds.1.desc: "The autumn rain froze where it fell, and the grass sleeps under a hand's width of ice the herds cannot break. The old men name it before the first camp does: zud. What the summer built, this winter means to take."
 mr_herds.1.entry: "A zud winter grips the steppe"
 mr_herds.1.historical_info: "The zud — an ice-locked or snow-heavy winter that starves livestock by the million — was the recurring catastrophe of steppe pastoralism, and driving the surviving herds toward the settled south in its wake was a standing cause of frontier war."
 mr_herds.1.a: "Slaughter early: salt the meat, sell the hides."
 mr_herds.1.b: "Endure. The Eternal Sky gives, and takes, and gives again."
