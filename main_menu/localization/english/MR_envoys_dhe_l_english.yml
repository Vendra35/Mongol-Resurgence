l_english:
 mr_envoys.1.title: "The Ming Embassy"
 mr_envoys.1.desc: "Envoys in silk arrive from the south with the manner of men addressing a defeated province. Their master, having driven the sons of Kubilai from the throne of China, invites the Khan to accept the place of a tributary and the peace of the new order."
 mr_envoys.1.entry: "A Ming embassy demands submission"
 mr_envoys.1.historical_info: "From the 1370s the early Ming court sent repeated embassies to the Northern Yuan demanding formal submission; the exiled court refused the claim and went on styling itself the legitimate empire — a diplomatic contest that outlived both first generations."
 mr_envoys.1.a: "The Khan of Khans bows to no one."
 mr_envoys.1.b: "Take the gifts. Promise nothing they can hold."
 mr_envoys.2.title: "Timur and the Khan"
 mr_envoys.2.desc: "Word comes west across the passes: a lord of Transoxiana, lame in one leg and terrible in war, is stacking thrones like firewood. His letters are courteous. His armies are not. Two powers of the steppe now measure one another across a distance neither trusts."
 mr_envoys.2.entry: "Timur's shadow reaches the steppe"
 mr_envoys.2.historical_info: "Timur corresponded with, sponsored, and finally broke the khans of the western steppe — Tokhtamysh, his one-time protege, saw the Golden Horde's cities burned in 1395-96 for challenging him."
 mr_envoys.2.a: "Courtesy between conquerors. For now."
 mr_envoys.2.b: "Return his envoys shaved. Let him come."
