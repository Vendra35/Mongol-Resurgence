 # ==============================================================================
 # ----------------- CASUS BELLI & WAR GOALS -----------------
 # ==============================================================================
 # War goals localize as war_goal_<wargoal_key> + _desc (vanilla:
 # war_goal_enforce_military_access in wargoals loc).

 cb_MR_steppe_unification: "Unification of the Steppe"
 cb_MR_steppe_unification_desc: "The clans of the steppe answer to one banner or to none. Whoever holds the Chinggisid claim has the right to compel the rest."
 cb_MR_carve_the_ulus: "Carve the Ulus"
 cb_MR_carve_the_ulus_desc: "The thing that could not be fought is coming apart, and its frontier provinces are answering to nobody in particular. Land like that has no owner for a season or two, and seasons like that do not come twice in a dynasty."
 cb_MR_silk_road: "Mastery of the Silk Road"
 cb_MR_silk_road_desc: "The road from the Ordos to Persia has paid tribute to the horde before, and will again. The cities along it are ours to take."
 cb_MR_westward_advance: "The Westward Advance"
 cb_MR_westward_advance_desc: "The Russian principalities paid tribute for two hundred and forty years. Their independence is a recent accident, and a reversible one."

 war_goal_MR_war_goal_steppe_unification: "Unify the Steppe"
 war_goal_MR_war_goal_steppe_unification_desc: "[war_goal|e] is to bring the Mongolian heartland under a single banner. Conquest is limited to the Mongolia region."
 war_goal_MR_war_goal_carve_the_ulus: "Carve the Ulus"
 war_goal_MR_war_goal_carve_the_ulus_desc: "[war_goal|e] is to take what the Khaghan can no longer hold. Conquest is limited to the frontier the Mongols conquered and the ulus lands now breaking away from them."
 war_goal_MR_war_goal_silk_road: "Seize the Silk Road"
 war_goal_MR_war_goal_silk_road_desc: "[war_goal|e] is to master the corridor from north China through Transoxiana. Conquest is limited to the Silk Road and China regions."
 war_goal_MR_war_goal_westward_advance: "Advance into the West"
 war_goal_MR_war_goal_westward_advance_desc: "[war_goal|e] is to restore the western ulus. Conquest is limited to the Russian, Pontic and Ural regions."

