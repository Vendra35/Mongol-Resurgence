 # --- Situation 1 Conquest Automation ---
 rule_MR_mongol_resurgence_auto_conquest: "(MR) Mongol Resurgence Conquest Automation"
 setting_MR_mongol_resurgence_auto_conquest_no: "Deactivated (Normal Game)"
 setting_MR_mongol_resurgence_auto_conquest_no_desc: "The AI will not receive any automatic territorial annexations. The unification of the steppe must be achieved through standard gameplay mechanics."
 setting_MR_mongol_resurgence_auto_conquest_yes: "Activated (Mongol Rise)"
 setting_MR_mongol_resurgence_auto_conquest_yes_desc: "Ensures the unification of the steppe. If the AI claimant is at peace by #G 1415#!, it will automatically annex the remaining rival khan territories in the Mongolia region and reduce the surviving hordes to tributaries.\n#G Highly recommended if the Mongol nations are controlled by the AI.#!"

 # --- Imperial Expansion Automation (Situations 2 & 3) ---
 rule_MR_imperial_auto_conquest: "(MR) Imperial Expansion Conquest Automation"
 setting_MR_imperial_auto_conquest_no: "Deactivated (Normal Game)"
 setting_MR_imperial_auto_conquest_no_desc: "The AI must secure the Silk Road corridor and the seats of the four khanates through standard warfare and diplomacy."
 setting_MR_imperial_auto_conquest_yes: "Activated (Imperial Path)"
 setting_MR_imperial_auto_conquest_yes_desc: "Acts as a safety net for the AI to ensure historical progression. If the AI claimant is at peace by #G 1545#! (Situation 2) or #G 1645#! (Situation 3), the remaining goal territories are handed over automatically.\n#G Highly recommended if the Mongols are controlled by the AI.#!"

 # --- The Great Partition: does history resume on schedule? ---
 rule_MR_partition_schedule: "(MR) The Great Partition — Historical Successor Schedule"
 setting_MR_partition_schedule_no: "Deactivated (The Empire Holds)"
 setting_MR_partition_schedule_no_desc: "Nothing secedes on a timer. The restored empire comes apart only if it genuinely loses ground, which in most games means it never comes apart at all.\n#Y Choose this for an uninterrupted world conquest.#!"
 setting_MR_partition_schedule_yes: "Activated (History Resumes)"
 setting_MR_partition_schedule_yes_desc: "#Y Sixteen theatres#! return, in the order they historically broke away and at a pace set by how long the situation has run.\n#G Highly recommended if the Mongols are AI - without it the endgame has nothing to break the empire with.#!"

 # --- Military Buffs ---
 rule_MR_mongol_buff_rule: "(MR) Mongol Military Buffs and Conquest Speed"
 setting_MR_buff_disabled: "Vanilla (No Buffs)"
 setting_MR_buff_disabled_desc: "No military modifiers. The AI railroad paces its wars at roughly one every #Y 2 years#!.\n#color_red Not recommended if the AI plays the Mongols.#!\n#G Recommended if YOU play them - the conquest is yours to earn.#!"
 setting_MR_buff_historical: "Historical (Balanced and Historical Conquest)"
 setting_MR_buff_historical_desc: "Balanced modifiers for slow historical progression, with roughly #Y 1 year#! between the AI railroad's wars. #G Highly recommended if the Mongols are AI.#!\n#Y A human Khaghan gets the same bonuses, and they are strong - pick Vanilla for a fair fight.#!"
 setting_MR_buff_enabled: "Terminator (Fast Conquest and Arcade Boss)"
 setting_MR_buff_enabled_desc: "Massive modifiers for lightning conquest; the AI railroad declares roughly every #Y 6 months#!.\n#color_red An apocalyptic end-game threat - pick this to be hunted.#!\n#color_red In your own hands it is a power fantasy, not a challenge.#!"

 # ==============================================================================
 # ----------------- FLAG LOCALIZATION -----------------
 # ==============================================================================
 # MGO and MGE are vanilla tags (both named plain "Mongolia" in vanilla's
 # country_names_l_english.yml:4904-4907). These overrides give the two stages
 # of the railroad distinct names.
 #
 # HOW A HORDE'S NAME IS ACTUALLY BUILT — this is not obvious and it cost a
 # real investigation. A steppe horde does NOT use its NAME key on the map.
 # customizable_localization/country_name_construction.txt:100 matches
 # government_type = steppe_horde first and resolves to
 # country_name_construction_prefix_name_horde, which is
 # "$country_name_construction_prefix_adjective_rank$" =
 # "$PREFIX$ $ADJ$ $RANK$". So the map name is built from the ADJECTIVE and
 # the RANK word, and MGE / MGO below are never read for it.
 #
 # RANK is picked by customizable_localization/country_ranks.txt, first match
 # wins: line 306 is rank_empire_horde (empire rank AND steppe horde), and the
 # plain rank_empire fallback sits far below at line 625. That is why forming
 # MGE rendered "Great Mongol Horde" — the tag changed, but the composition
 # never touched the MGE key. Vanilla behaves identically; the familiar
 # "Mongol Empire" is the formable BUTTON label (MGE_f), not the country name.
 #
 # The fix is one line: rank_empire_horde below. MGE sits at empire rank
 # (MGE_f's form_effect sets it) so it composes "Great" + "Mongol" + "Empire";
 # MGO sits lower and takes rank_kingdom_horde, which vanilla still renders
 # "Horde", giving "Mongol Horde". Exactly the two names the railroad wants,
 # with no whole-file override of vanilla's 700-line country_ranks.txt.
 # Side effect, accepted: any OTHER steppe horde that reaches empire rank also
 # reads "Empire" instead of "Horde". Hordes below empire rank are untouched.
 #
 # MGE / MGO keys are still kept: they are what event text and any $MGE$
 # reference resolve to. RULE: a tag's name must never contain the word
 # "Empire" — no vanilla tag name does, and country_database.cpp warns about
 # it because rank titles compose as "The Great <name> Empire". So the NAME
 # key stays the historical Yeke Mongol Ulus ("Great Mongol State") while the
 # composed map name reads "Great Mongol Empire".
 #
 # (The old mge_empire / mgo_horde keys were deleted. They were copied from
 # PD's ngc_confederation, and PD defines no country_ranks branch for that key
 # either — dead in both mods. The engine reads rank_empire_horde /
 # rank_kingdom_horde, never <tag>_<rank>.)
 rank_empire_horde: "Empire"
 MGE: "Mongol Empire"
 MGE_ADJ: "Mongol"
 MGE_f: "Mongol Empire"
 MGE_f_desc: "The restored empire of the Great Khans — the Yeke Mongol Ulus — forged from the fractured tribes of the steppe under the iron will of a new Chinggisid. Its disciplined hordes and imperial administration now stand as the dominant power across Asia and beyond."

 MGO: "Mongol Horde"
 MGO_ADJ: "Mongol"
 MGO_f: "Mongol Horde"
 MGO_f_desc: "A powerful confederation of Mongol tribes, united under a single khan. Though not yet an empire, its warrior traditions and steppe mobility make it a threat to all settled civilizations on its borders."

 # The Khanate of Bukhara, a Great Partition heir. These two keys exist
 # nowhere in vanilla — "Bukhara", "Khiva", "Uzbek" and "Shaybanid" all
 # return zero hits in country_names_l_english.yml — which is why the tag
 # itself had to be registered in zz_mr_new_countries.txt. Adjective form
 # matters more than the name: at empire rank the displayed title composes
 # from ADJ + RANK and the NAME key is never read.
 BUK: "Bukhara"
 BUK_ADJ: "Bukharan"

