 mr_dominance.10.title: "The Eagle of the Steppe"
 mr_dominance.10.desc: "The struggle for the Mongol destiny has begun! The fractured tribes and khanates of the steppe have entered a period of intense competition. One among them will rise to unite the warring clans and reclaim the glory of Chinggis Khaan. Our warriors are ready, our scouts have mapped the enemy camps, and the time for action is now."
 mr_dominance.10.a: "Let the hooves thunder!"
 # --- The seat moves to Khanbaliq ---
 mr_dominance.136.title: "The Seat Moves to Khanbaliq"
 mr_dominance.136.desc: "Karakorum was a camp that learned to build walls. It was never a capital for an empire that now counts farmers, tax rolls and canal engineers among its subjects.\n\nThe court has gone south to [ShowLocationName('dadu')] — Khanbaliq, the City of the Khan — as Kublai took it in 1272. The felt tents still stand outside the walls, and the Khan still sleeps in one when the summer is good. But the empire is governed from the city now."
 mr_dominance.136.a: "The grass remembers us. The world will remember this."
 mr_dominance.137.title: "Karakorum or Khanbaliq?"
 mr_dominance.137.desc: "The old capital sits where the horse herds are, three months' hard riding from the provinces that pay for everything. Our ministers have begun to say aloud what our tax collectors have said quietly for years: an empire this shape cannot be run from a camp on the Orkhon.\n\nKublai faced the same argument and moved the court to [ShowLocationName('dadu')] in 1272. The old guard called it the day the Mongols stopped being Mongols. The treasury called it the day the empire started working."
 mr_dominance.137.a: "Move the court to Khanbaliq."
 mr_dominance.137.b: "The Khan rules from the grass. Karakorum stands."
