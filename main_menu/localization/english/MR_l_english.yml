 # ==============================================================================
 # ----------------- GAME RULES -----------------
 # ==============================================================================
 # Convention: rule_<rule_key>, setting_<option>, setting_<option>_desc
 # (vanilla game_rules_l_english.yml).

 # --- Master Switch ---
 rule_mr_railroad: "(MR) Mongol Resurgence Content"
 setting_mr_railroad_on: "Enabled"
 setting_mr_railroad_on_desc: "All Mongol Resurgence content is active: the three-phase railroad, the historical event layer, and the late-steppe situations."
 setting_mr_railroad_off: "Off"
 setting_mr_railroad_off_desc: "All Mongol Resurgence content is disabled."

 # --- Situation 1 Conquest Automation ---
 rule_MR_mongol_resurgence_auto_conquest: "(MR) Mongol Resurgence Conquest Automation"
 setting_MR_mongol_resurgence_auto_conquest_no: "Deactivated (Normal Game)"
 setting_MR_mongol_resurgence_auto_conquest_no_desc: "The AI will not receive any automatic territorial annexations. The unification of the steppe must be achieved through standard gameplay mechanics."
 setting_MR_mongol_resurgence_auto_conquest_yes: "Activated (Mongol Rise)"
 setting_MR_mongol_resurgence_auto_conquest_yes_desc: "Ensures the unification of the steppe. If the AI claimant is at peace by #G 1415#!, it will automatically annex the remaining rival khan territories in the Mongolia region and reduce the surviving hordes to tributaries.\n#G Highly recommended if the Mongol nations are controlled by the AI.#!"

 # --- Imperial Expansion Automation (Situations 2 & 3) ---
 rule_MR_imperial_auto_conquest: "(MR) Imperial Expansion Conquest Automation"
 setting_MR_imperial_auto_conquest_no: "Deactivated (Normal Game)"
 setting_MR_imperial_auto_conquest_no_desc: "The AI must secure the Silk Road corridor and the nine imperial seats through standard warfare and diplomacy."
 setting_MR_imperial_auto_conquest_yes: "Activated (Imperial Path)"
 setting_MR_imperial_auto_conquest_yes_desc: "Acts as a safety net for the AI to ensure historical progression. If the AI claimant is at peace by #G 1545#! (Situation 2) or #G 1645#! (Situation 3), the remaining goal territories are handed over automatically.\n#G Highly recommended if the Mongols are controlled by the AI.#!"

 # --- Military Buffs ---
 rule_MR_mongol_buff_rule: "(MR) Mongol Military Buffs and Conquest Speed"
 setting_MR_buff_disabled: "Vanilla (No Buffs)"
 setting_MR_buff_disabled_desc: "No special military modifiers will be granted.\n#color_red Not recommended for AI-controlled Mongols.#!"
 setting_MR_buff_historical: "Historical (Balanced and Historical Conquest)"
 setting_MR_buff_historical_desc: "Grants balanced military modifiers focused on slow historical progression.\n#G Highly recommended if the Mongols are controlled by the AI.#!"
 setting_MR_buff_enabled: "Terminator (Fast Conquest and Arcade Boss)"
 setting_MR_buff_enabled_desc: "Grants massive military modifiers for lightning-fast conquest, and the Phase 1 AI railroad declares its unification wars roughly every #Y 2 years#! instead of every 4-10.\n#color_red WARNING: Transforms the AI into an apocalyptic end-game threat.#!"

 # --- Timeline & Pacing ---
 rule_MR_timeline_pacing_rule: "(MR) Timeline & Pacing"
 setting_MR_timeline_frontloaded: "Dynamic & Frontloaded"
 setting_MR_timeline_frontloaded_desc: "The Phase 1 AI railroad declares a unification war roughly every #Y 4 years#!.\n#G Recommended if you want to experience the mod's content early.#!"
 setting_MR_timeline_strict_historical: "Strict Historical Dates (Historical Path)"
 setting_MR_timeline_strict_historical_desc: "The Phase 1 AI railroad paces its unification wars at roughly one per #Y decade#!, following the real timeline.\n#G Highly recommended for long campaigns and realistic historical playthroughs.#!"

