 # ==============================================================================
 # ----------------- PHASE 2 IMPERIAL EVENTS (mr_imperial) -----------------
 # ==============================================================================

 mr_imperial.100.title: "The Invasion Plans"
 mr_imperial.100.desc: "Our scouts have returned with detailed maps of our target's defenses. We know where their armies are weak, where their walls are thin, and where their people are most vulnerable. The time has come to draw up the final invasion plans."
 mr_imperial.100.a: "Mark the targets!"

 mr_imperial.101.title: "The First Wave"
 mr_imperial.101.desc: "Our initial assaults have struck with devastating force. The enemy's border defenses have crumbled, and our advance units are already deep in their territory. The second wave must follow quickly to exploit the breach before they can regroup."
 mr_imperial.101.a: "Send the second wave!"

 mr_imperial.102.title: "The City Falls"
 mr_imperial.102.desc: "One of the enemy's great cities has fallen! Our warriors have breached the walls after a brutal siege, and the defenders have surrendered. The treasures of the city are ours, and its strategic position will serve as our forward base for the next phase of the invasion."
 mr_imperial.102.a: "Strip it of everything valuable!"

 mr_imperial.103.title: "The Counter-Attack"
 mr_imperial.103.desc: "The enemy has rallied! Our overextended forces have been hit by a desperate counter-attack. Our advance has been halted, and several forward units are in danger of being cut off. We must either commit our reserves or risk losing everything we've gained."
 mr_imperial.103.a: "Hold the line! Send reinforcements!"
 mr_imperial.103.b: "Fall back to defensible positions."

 mr_imperial.200.title: "The Empire Secured"
 mr_imperial.200.desc: "The campaign has ended in total victory! Our enemies have been crushed, their capitals sacked, and their rulers brought before us in chains. The Mongol Empire now controls territory our ancestors never dreamed of. This is the beginning of our golden age."
 mr_imperial.200.a: "The empire is secure!"

 mr_imperial.201.title: "A New Empire Rises"
 mr_imperial.201.desc: "News spreads across the world: the Mongol horde has triumphed. Ancient kingdoms have fallen, and a new imperial power bestrides Asia like a colossus. Foreign courts tremble at the mention of the Great Khan's name, and emissaries from distant lands seek our favor."
 mr_imperial.201.a: "Let them come and pay tribute!"

 mr_imperial.202.title: "The Grand Review"
 mr_imperial.202.desc: "With the conquest complete, we hold a grand review of our victorious armies. Regiment after regiment of elite cavalry passes before the Great Khan, their banners fluttering in the wind, their armor gleaming, and their discipline a testament to the new Mongol military order."
 mr_imperial.202.a: "A sight to inspire generations!"

 mr_imperial.210.title: "The Campaign Stalls"
 mr_imperial.210.desc: "Our advance has ground to a halt. The enemy has adapted to our tactics, their defenses have stiffened, and our supply lines are stretched to breaking point. The dream of a vast Mongol empire is fading with each day of stalemate."
 mr_imperial.210.a: "We underestimated them."

 mr_imperial.211.title: "The Retreat from the West"
 mr_imperial.211.desc: "The campaign has become untenable. Our forces are being pushed back on all fronts, and every mile we retreat is a mile of conquered territory lost. The settled peoples have proven their resilience, and the Great Khan's ambition has been checked by the realities of war."
 mr_imperial.211.a: "A painful lesson."

 # ==============================================================================
 # ----------------- HORDE INSTITUTIONS DHE (mr_dominance_dhe) -----------------
 # ==============================================================================

 mr_dominance_dhe.1.title: "The Forge of Warriors"
 mr_dominance_dhe.1.entry: "(MR) - The Forge of Warriors (AI Only)"
 mr_dominance_dhe.1.desc: "The old ways of tribal warfare will no longer suffice. To conquer the settled empires, we must transform our warriors into a disciplined military machine. Our smiths will forge better weapons, our trainers will drill the horde into coordinated units, and our tacticians will study the defensive weaknesses of our enemies."
 mr_dominance_dhe.1.a: "Forge the weapon that will conquer the world!"

 mr_dominance_dhe.2.title: "The Imperial Encampment"
 mr_dominance_dhe.2.entry: "(MR) - The Imperial Encampment (AI Only)"
 mr_dominance_dhe.2.desc: "Our capital must become worthy of a Great Khan. No longer a mere encampment, it shall be transformed into the political and military heart of our growing empire. From here, our commands will reach every corner of the steppe and beyond. The great tents of our generals, the forges of our smiths, and the training grounds of our warriors will make this the most formidable military center in the world."
 mr_dominance_dhe.2.a: "Let the world see our power!"

 mr_dominance_dhe.3.title: "The Wall Breakers"
 mr_dominance_dhe.3.entry: "(MR) - The Wall Breakers (AI Only)"
 mr_dominance_dhe.3.desc: "The great weakness of the settled peoples is their reliance on walls and fortifications. They believe stone can stop the Mongol horde. We will prove them wrong. By incorporating captured siege engineers and developing our own techniques, we will ensure that no city, no matter how well defended, can withstand our assault."
 mr_dominance_dhe.3.a: "No wall shall stand in our path!"

 mr_dominance_dhe.4.title: "The Kurultai"
 mr_dominance_dhe.4.entry: "(MR) - The Great Kurultai"
 mr_dominance_dhe.4.desc: "The time has come to formalize our supreme authority over all Mongol peoples. A great Kurultai has been called, and chieftains from every corner of the steppe have gathered to acknowledge our dominion. By the ancient traditions, we shall be proclaimed the undisputed Great Khan, and the scattered tribes shall be formally unified into a single, indivisible nation."
 mr_dominance_dhe.4.a: "Let the Kurultai declare our destiny!"

 mr_dominance_dhe.5.title: "The Absorption of the Rival Horde"
 mr_dominance_dhe.5.entry: "(MR) - The Absorption of Rival Hordes (AI Only)"
 mr_dominance_dhe.5.desc: "The time has come to fully integrate our subjugated rival khanates. Their warriors shall be incorporated into our horde, their pastures absorbed into our domain, and their chieftains reduced to loyal commanders under our supreme authority. The era of divided Mongol loyalties ends today."
 mr_dominance_dhe.5.a: "They are Mongols no more. They are ours."

 mr_dominance_dhe.6.title: "The Silk Road Reborn"
 mr_dominance_dhe.6.entry: "(MR) - The Silk Road Reborn (AI Only)"
 mr_dominance_dhe.6.desc: "The ancient trade routes that once connected the East and West have fallen into disrepair and banditry. Under Mongol rule, we shall restore and protect the Silk Road, turning it into the economic backbone of our empire. Merchants will travel safely under our protection, and the wealth of three continents will flow through our lands."
 mr_dominance_dhe.6.a: "Let the caravans flow!"

 mr_dominance_dhe.7.title: "The Imperial Melting Pot"
 mr_dominance_dhe.7.entry: "(MR) - The Imperial Melting Pot (AI Only)"
 mr_dominance_dhe.7.desc: "Our empire now encompasses countless cultures, faiths, and traditions. Rather than suppress this diversity, we shall harness it. The most talented administrators, engineers, and scholars from across our domain shall be brought to the imperial court, creating a sophisticated imperial culture that draws strength from all its peoples."
 mr_dominance_dhe.7.a: "Let knowledge flow to the center!"

 mr_dominance_dhe.8.title: "The Yam Postal Relay"
 mr_dominance_dhe.8.entry: "(MR) - The Yam System (AI Only)"
 mr_dominance_dhe.8.desc: "To govern our vast empire, communication must be swift and reliable. We shall establish the Yam, a system of relay stations across our territory that will allow messengers to cover vast distances at unprecedented speed. Orders from the Great Khan will reach the farthest corners of the empire in days rather than months."
 mr_dominance_dhe.8.a: "Let nothing slow our commands!"

 mr_dominance_dhe.9.title: "The Reforged Tumen"
 mr_dominance_dhe.9.entry: "(MR) - The Reforged Tumen (AI Only)"
 mr_dominance_dhe.9.desc: "The old army of the Great Khans was not a mob of riders but a machine: ten men to an arban, ten arbans to a zuun, ten zuuns to a mingghan, ten mingghans to a tumen. Every man knew his place in it, and the world learned to fear what that order could do.\n\nAt Karakorum the war camps are rising again. The smiths are at their forges, the drillmasters count in tens, and the clans that came to the sacred capital as rivals are learning to ride as one people."
 mr_dominance_dhe.9.a: "Ten, a hundred, a thousand, ten thousand!"
 mr_dominance_dhe.9.a.tt1: "Research the [ShowAdvanceName('horse_lords')] advance"
 mr_dominance_dhe.9.a.tt2: "The Khan's decree rebuilds the war camps of our capital:"
 mr_dominance_dhe.9.a.tt3: "Five free [ShowBuildingTypeName('kurultai')] and [ShowBuildingTypeName('armory')] buildings, twenty regiments of [ShowUnitDefinitionName('a_steppe_horse_archers')], and the camps turn Mongol"
 mr_dominance_dhe.9.a.tt4: "The tumen system is restored."

 mr_dominance_dhe.10.title: "Karakorum Restored"
 mr_dominance_dhe.10.entry: "(MR) - Karakorum Restored (AI Only)"
 mr_dominance_dhe.10.desc: "Ogedei built a capital of walls and granaries on the Orkhon, with a silver tree in its courtyard that poured wine for the ambassadors of the world. Two centuries of neglect have left little but the walls' foundations.\n\nNow the caravans are returning. The Khan has decreed a city where the encampment stood: barracks for the standing guard, a citadel over the river crossing, a market for the Silk Road traffic, and a court where every people of the steppe — Oirat, Buryat, Khamag — is received with honor."
 mr_dominance_dhe.10.a: "Raise the city of the Khans!"
 mr_dominance_dhe.10.a.tt1: "Research the [ShowAdvanceName('barracks_advance')] advance"
 mr_dominance_dhe.10.a.tt2: "The Khan's decree raises [ShowLocationName('karakorum')] to a city:"
 mr_dominance_dhe.10.a.tt3: "City rank, a free [ShowBuildingTypeName('castle')], five free [ShowBuildingTypeName('barracks')] and [ShowBuildingTypeName('armory')] buildings, forty regiments of [ShowUnitDefinitionName('a_steppe_horse_archers')], and the camps turn Mongol"
 mr_dominance_dhe.10.a.tt4: "A market rises on the caravan road, and the kin peoples are accepted at court."

 mr_dominance_dhe.11.title: "The Observatory of Samarkand"
 mr_dominance_dhe.11.entry: "(MR) - The Observatory of Samarkand"
 mr_dominance_dhe.11.desc: "On the hill above Samarkand, masons are raising a curved wall of cut stone taller than any minaret — the great sextant of an observatory the like of which no court has ever kept. Its tables will fix the stars for three hundred years.\n\nThe astronomers came for a prince's patronage and found a Khan's: the horde that counts every horse on the steppe has decided to count the heavens too."
 mr_dominance_dhe.11.a: "Let the stars be counted like the herds."

 mr_dominance_dhe.12.title: "The Count of the Herds"
 mr_dominance_dhe.12.entry: "(MR) - The Count of the Herds"
 mr_dominance_dhe.12.desc: "The old law is simple: what the Khan cannot count, the Khan does not rule. The scribes have come up from the settled lands with their ledgers, and the clans have driven their herds to the counting grounds at Karakorum for the first census since the empire broke.\n\nEvery man of fighting age, every horse, every sheep — entered in the rolls. The chiefs grumble that a counted horde is a taxed horde. They are correct. It is also an army."
 mr_dominance_dhe.12.a: "Count the men first. The tumens must be filled."
 mr_dominance_dhe.12.b: "Count the herds first. The campaigns must be paid for."

