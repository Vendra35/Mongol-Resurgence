 # --- The world reacts: spectators, victims, broken alliances ---
 mr_dominance.20.title: "Word from the Grasslands"
 mr_dominance.20.desc: "Riders out of the north bring the same report to every court that will hear it: the Mongol clans are quarrelling no longer. Envoys pass between camps that fought each other a season ago, and the old titles — Great Khan, kurultai, the banner of the nine tails — are being spoken aloud again for the first time in a generation.\n\nOur merchants who winter on the caravan roads say the horse herds are being gathered, not scattered. That is not the habit of a people at peace with itself, nor of one that means to stay home."
 mr_dominance.20.a: "Let the scouts watch the passes."
 mr_dominance.21.title: "The Hooves on Our Own Grass"
 mr_dominance.21.desc: "It is not distant news to us. The riders speak of a claim to the whole heartland, and the ground they name as theirs is the ground beneath our tents.\n\nOur elders remember what the last unification cost the world. Whoever wins the kurultai will not be content to rule an empty steppe — and we are standing precisely where he intends to plant his standard."
 mr_dominance.21.a: "Then we had better not be standing still."
 mr_dominance.22.title: "The Horde Turns Outward"
 mr_dominance.22.desc: "The steppe has one master now, and a united horde does not sit idle. Word comes from the caravan cities that the new Khan has taken the road south and west — that the Silk Road itself is to be brought under one hand, and behind it the fields of northern China.\n\nThis is no longer a quarrel between herdsmen. Every court from Samarkand to the Yellow River is recalculating what it can hold and what it must surrender."
 mr_dominance.22.a: "Send word to our garrisons."
 mr_dominance.23.title: "They Are Coming For Our Roads"
 mr_dominance.23.desc: "The Khan's heralds have named the lands he intends to take, and ours are on the list. The corridor our wealth rides through, the passes our armies hold, the cities our fathers walled — all of it is spoken of in the kurultai as though it were already counted among the Khan's herds.\n\nThere will be no negotiation worth the name. There will be a summer, and then there will be riders."
 mr_dominance.23.a: "Man the walls."
 mr_dominance.24.title: "Old Friends on the Wrong Road"
 mr_dominance.24.desc: "The kurultai has spoken, and the road it has chosen runs through the lands of men we call allies. A Khan cannot ride around his own treaties forever.\n\nThe seals are returned, the envoys sent home with courtesy and without explanation. Better an honest enemy ahead of us than a friend we must betray at the worst moment."
 mr_dominance.24.a: "The road comes first."
 mr_dominance.25.title: "The Four Corners Remembered"
 mr_dominance.25.desc: "The Yeke Mongol Ulus is proclaimed. From the Sea of Japan to Transoxiana the imperial banner flies unbroken, and the new Great Khan has made no secret of what he wants next: the old empire had four corners, and three of them still answer to other masters.\n\nThe courts of Rus, Persia and Anatolia have begun to speak of the Mongols in the present tense again."
 mr_dominance.25.a: "History is repeating itself."
 mr_dominance.26.title: "The Shadow Falls Westward"
 mr_dominance.26.desc: "The Great Khan's claim reaches our own borders now. He does not speak of conquest but of restoration — of taking back what his ancestors held, as though the century since had been a clerical error.\n\nOur chroniclers have read what happened to Baghdad, to Kiev, to Samarkand. We would rather not furnish them with a fresh chapter."
 mr_dominance.26.a: "Gather every sword we have."
 mr_dominance.27.title: "Treaties of a Lesser Age"
 mr_dominance.27.desc: "The empire our ancestors built did not stop at the borders of its friendships, and neither will ours. Every alliance that stands between the horde and the four corners is dissolved today — quietly, and without insult, but dissolved.\n\nThose who wished to stand beside us may still do so. They will simply have to do it out of our way."
 mr_dominance.27.a: "Let none say we struck without warning."
 mr_dominance.28.title: "A Khan Owes Nothing"
 mr_dominance.28.desc: "The banner is raised and the claim is made. But a claimant hemmed in by his own oaths is no claimant at all — and several of the camps we swore friendship to are pitched squarely on the heartland we have just claimed as ours.\n\nThe oaths are set aside. The steppe has only ever recognised one kind of bond in the end, and it is not written on paper."
 mr_dominance.28.a: "The banner outranks the oath."

 # --- The Great Partition: threshold beats ---
 mr_partition.1.title: "A Courier Does Not Return"
 mr_partition.1.desc: "The relay post at the Kerulen bend has gone three months without a rider from the west. That is not, in itself, a rebellion. Couriers drown, horses founder, winters close roads. But the yam was the nervous system of everything Chinggis built, and a limb that stops reporting has stopped being governed.\n\nThe scribes bring the tally without being asked. Four western ordus have not sent their share of the levy this season. Their letters are polite, their reasons plausible, and not one of them mentions the Khaghan by name."
 mr_partition.1.a: "Send riders. Let them see we still count."
 mr_partition.11.title: "The Great Khan's Silence"
 mr_partition.11.desc: "Our envoys on the Mongol frontier report something they cannot quite name. The border garrisons are still there, still disciplined, still unmistakably the horde. But the orders they follow now come from their own ulus khan, and when our men ask after the Khaghan they get careful answers.\n\nAn empire that must be careful about its own name has begun to end. Whether that is opportunity or catastrophe depends entirely on how close one lives to it, and we live very close indeed."
 mr_partition.11.a: "Watch the border. Say nothing yet."
 mr_partition.2.title: "The Kurultai Will Not Assemble"
 mr_partition.2.desc: "The summons went out under the horsetail standard, as it has since Chinggis. Half the ulus khans have not come. Of those who did, three arrived with more armed men than protocol permits and camped apart from the others, on ground they chose themselves.\n\nNobody has said the word. Nobody needs to. The empire is still one realm on every map in the chancery, and in the felt tents outside it is already several, waiting to find out which of them will admit it first."
 mr_partition.2.a: "Let them camp where they like. For now."
 mr_partition.12.title: "The Ulus Khans Are Taking Meetings"
 mr_partition.12.desc: "A rider came to our court without banners, from a khan who is technically a subject of the Khaghan and did not once use the word. He wanted to know what we would consider a border. He wanted to know it quietly.\n\nWe have spent generations learning to live beside an empire that could not be fought. That empire is negotiating with itself now, and its pieces have started shopping for friends."
 mr_partition.12.a: "Receive him. Promise nothing, refuse nothing."
 mr_partition.22.title: "News From the Steppe Road"
 mr_partition.22.desc: "The caravans arrive later each season, and their masters have stopped complaining about tolls, which is how we know the tolls are no longer being collected by anyone in particular. Merchants who once crossed the whole continent under a single peace now hire their own guards between one pasture and the next.\n\nThe Pax Mongolica was never loved. It is going to be missed."
 mr_partition.22.a: "Note it in the chronicle. Raise the insurance."
 mr_partition.3.title: "Each Ulus for Itself"
 mr_partition.3.desc: "It has stopped being a question of loyalty and become a question of logistics. The western khans are not defying us; they are simply governing, because someone must, and Karakorum is a season away and getting further.\n\nThis is how it ended the last time. Not with a battle lost but with grandsons who each held a quarter of the world and saw no reason to ask permission. We are living inside the same year our ancestors lived in, and we already know what it is called."
 mr_partition.3.a: "Hold the heartland. That much is still ours."
 mr_partition.13.title: "The Carcass and the Crows"
 mr_partition.13.desc: "The thing that could not be resisted is coming apart on our doorstep, and every neighbour it ever terrified is doing the same arithmetic we are: which piece, how soon, and who else has noticed.\n\nThere will not be a second chance at this. Land that has been Mongol since before our grandfathers is about to have no owner at all for a season or two, and seasons like that do not come twice in a dynasty."
 mr_partition.13.a: "Muster. Quietly, and quickly."
 mr_partition.23.title: "The World Without the Khan"
 mr_partition.23.desc: "For as long as anyone at court can remember, every calculation began with the Mongols: what they would permit, where they would look, how long we had. That single fact organised the age.\n\nIt is being removed. The maps will need redrawing, and so will every assumption drawn on top of them, and the men who redraw them fastest will inherit the century."
 mr_partition.23.a: "An age is ending. Prepare for the next one."

 mr_partition.100.title: "The Kurultai Demands an Answer"
 mr_partition.100.desc: "They have come this time, and that is worse than the season they stayed away. The ulus khans are seated in order of precedence, drinking our airag, and one after another they have laid the same complaint before the standard: the pastures are theirs, the herds are theirs, the men who ride for us are theirs, and the orders come from a city none of them has seen in twenty years.\n\nThe old law is on their side and everyone in the tent knows it. Chinggis divided the world among his sons because no one man can watch all of it, and every Khaghan since has spent his reign pretending otherwise. The assembly is not asking whether the empire will change. It is asking who will say so first, and what it will cost."
 mr_partition.100.a: "Let them have their pastures. A smaller realm that answers is worth more than a wide one that does not."
 mr_partition.100.b: "There is one standard and one law. They will be bound to the centre."
 mr_partition.100.c: "Open the treasury. Loyalty that must be bought is still loyalty this year."
 mr_partition.200.title: "The Ulus Endures"
 mr_partition.200.desc: "The century that ended every other steppe power has closed, and we are still here. Not as our great-grandfathers were: the tumens drill beside cast guns now, the tax rolls are counted twice by clerks who cannot ride, and the governors we send to the uluses stay where they are put and write letters instead of raising their own banners.\n\nSomething was traded away for that. The old men say it in the felt tents and they are not wrong. But every horde that refused the trade is a name in somebody else's chronicle, and we are a state with a capital, an army and a treasury — which is the only form in which the steppe was ever going to survive its own ending."
 mr_partition.200.a: "Let the chroniclers argue. We are still here."
 mr_dominance.1.title: "The Rise of the Great Khan"
 mr_dominance.1.desc: "The steppe has chosen its master! Through blood, iron, and unrelenting will, our horde has subjugated all rivals and united the Mongol tribes under a single banner. The days of petty khans and divided pastures are over. A new Great Khan has emerged, and the world shall once again learn to fear the Mongol name.\n\nFrom the Altai Mountains to the Gobi Desert, the clans now ride as one. But this is merely the beginning. Our ancestors conquered half the known world. We shall finish what they started."
 mr_dominance.1.a: "The world is ours to conquer!"

 mr_dominance.2.title: "The Steppe Remains Divided"
 mr_dominance.2.desc: "Our ambitions lie in ruins. Another khan has claimed dominance over the steppe, and our warriors are scattered to the winds. The dream of a united Mongol nation under our banner is dead. We must accept our diminished place in history and perhaps, one day, a new generation will rise to reclaim what we have lost."
 mr_dominance.2.a: "We will endure, as the steppe always does."

 mr_dominance.11.title: "The Banner Offered"
 mr_dominance.11.desc: "Karakorum is ours. The chiefs came for plunder and stayed for something else: in the shadow of the ruined palace of Ogedei, the eldest of them has unrolled a white banner of nine horsetails and set it before our tent.\n\nThe meaning is not subtle. Whoever raises that banner over the sacred capital claims what Chinggis built — every clan, every pasture, every quarrel on the steppe becomes theirs to command and theirs to answer for. The chiefs wait. The banner lies where they set it."
 mr_dominance.11.a: "Raise the banner. We take up the claim of Chinggis!"
 mr_dominance.11.b: "Our path is our own. Let another carry it."

 mr_dominance.100.title: "Gathering the Horde"
 mr_dominance.100.desc: "Before we can strike at our rivals, we must consolidate our own forces. The scattered tribes and clans must be rallied to our banner. Our diplomats ride to every camp, offering a simple choice: join us willingly or face the consequences after our victory."
 mr_dominance.100.a: "Summon every warrior!"

 mr_dominance.101.title: "The Steppe Stirs"
 mr_dominance.101.desc: "Reports from the Mongol heartland indicate a major power struggle is underway. Tribes are abandoning their ancestral pastures, alliances are being forged and broken with alarming speed, and the thunder of massing cavalry can be heard across the grasslands. A new power is rising on the steppe."
 mr_dominance.101.a: "We shall watch closely."

 mr_dominance.102.title: "The Shadow of the Khan"
 mr_dominance.102.desc: "Ominous news from the steppe! A rival khan has been gathering unprecedented support among the tribes. Their warriors outnumber ours, and their scouts have been spotted near our borders. It is clear they intend to challenge us for supremacy. We must prepare our defenses or risk being swept away by the coming storm."
 mr_dominance.102.a: "We will not be conquered!"

 mr_dominance.103.title: "The Thunder of Hooves"
 mr_dominance.103.desc: "The preparations are complete. Our warriors have gathered from every corner of the steppe, their horses restless and their blades sharp. The time has come to strike at our rival and claim our rightful place as the sole power of the Mongol nation. Let our enemies tremble!"
 mr_dominance.103.a: "Charge! For the glory of the Khan!"
 mr_dominance.103.b: "Wait... we are not ready yet. (Postpone for 10 years)"

 mr_dominance.104.title: "A New Khan Rises"
 mr_dominance.104.desc: "The power struggle on the steppe has reached its conclusion. A new Great Khan of the Borjigin blood has emerged victorious, having crushed all rivals and united the Mongol tribes under a single war banner. The balance of power in Asia has been fundamentally altered, and the established empires beyond the steppe must now reckon with a resurgent Mongol threat."
 mr_dominance.104.a: "They grow stronger by the day."

 mr_dominance.105.title: "Karakorum Is Ours"
 mr_dominance.105.desc: "The sacred capital has been taken. Our riders came through the Orkhon valley and found the old city half in ruin, its walls patched with rubble, its Buddhist and Nestorian quarters emptied by a century of neglect — and none of that matters. This is the ground Ogedei paved, where the envoys of Rome and Baghdad once waited their turn to kneel. The horsetail standard stands over it again.\n\nThe clans understand what a capital means. A khan with a camp commands whoever happens to be riding beside him; a khan seated at Karakorum commands the memory of the empire itself. Word is already going out across the steppe, and the lesser khans are counting their warriors with a new anxiety."
 mr_dominance.105.a: "Let the standard fly where Ogedei raised it."

 mr_dominance.107.title: "Scattered to the Winds"
 mr_dominance.107.desc: "Disaster! Our forces have been routed, our warriors flee in disarray, and our rival has proven the stronger. The campaign has ended in humiliating defeat. Our prestige is shattered, and many of the tribes that swore allegiance to us now abandon our banner. We must retreat and lick our wounds."
 mr_dominance.107.a: "We will remember this shame."

 mr_dominance.120.title: "Beyond the Steppe"
 mr_dominance.120.desc: "The steppe is united under our banner, but the Mongol destiny demands more. The great empires beyond our borders are wealthy, decadent, and ripe for conquest. Our scouts report that the settled peoples have grown soft behind their walls. They have forgotten what it means to face the Mongol horde. It is time to remind them.\n\nThe Road to Empire begins now."
 mr_dominance.120.a: "Point us toward the richest lands!"

 mr_dominance.121.title: "The Mongol Awakening"
 mr_dominance.121.desc: "Having secured dominance over the steppe, the unified Mongol nation is now turning its gaze outward. Mass mobilization is underway, and the great khans speak openly of resurrecting the empire of Chinggis. The settled civilizations bordering the grasslands prepare nervously for what may come."
 mr_dominance.121.a: "The storm approaches."

 mr_dominance.122.title: "The Horde at the Gates"
 mr_dominance.122.desc: "Our worst fears have materialized. The Mongol horde has been sighted massing on our borders, their numbers beyond counting. The steppe tribes have united under a single Great Khan, and their eyes are fixed hungrily upon our lands. We must rally every soldier we have or face annihilation."
 mr_dominance.122.a: "Sound the alarm!"

 mr_dominance.123.title: "The Great Invasion"
 mr_dominance.123.desc: "The time for preparation is over. Our horde stands ready, a sea of warriors stretching to the horizon. The walls of our enemies will crumble, their armies will scatter, and their treasures will fill our carts. The Mongol Empire rises today!"
 mr_dominance.123.a: "Let the conquest begin!"
 mr_dominance.123.b: "We need more time to gather our full strength... (Postpone for 5 years)"

 mr_dominance.124.title: "The Empire Rises"
 mr_dominance.124.desc: "Our armies have swept across the continent like a divine wind. Cities that had stood for centuries have fallen, empires that thought themselves eternal have crumbled, and the Mongol banner now flies over lands our ancestors could only dream of. The Road to Empire has reached its glorious destination."
 mr_dominance.124.a: "The world kneels before the Great Khan!"

 mr_dominance.125.title: "The Yeke Mongol Ulus Proclaimed"
 mr_dominance.125.desc: "The unthinkable has occurred. The Silk Road answers to one master, the Ming mandate is broken, and the chieftains have gathered in a Great Kurultai the like of which the steppe has not seen since Chinggis. Before the assembled tumens, the white standard of nine horsetails is raised, and the empire itself is proclaimed anew: the Yeke Mongol Ulus, the Great Mongol State.\n\nAncient kingdoms have been reduced to vassals, and the map of Asia has been permanently redrawn by the sword. The era of Mongol dominance has begun."
 mr_dominance.125.a: "The empire lives again!"

 mr_dominance.127.title: "The Tide Recedes"
 mr_dominance.127.desc: "Our great campaign has failed. The settled peoples proved more resilient than we anticipated, their walls held firm, and their armies fought with desperation born of defending their homes. Our horde has been repelled, and the dream of a new Mongol Empire lies in ruins. We must retreat to the steppe and rebuild."
 mr_dominance.127.a: "A bitter retreat."

 mr_dominance.130.title: "The Mongol Age"
 mr_dominance.130.desc: "Our empire now stretches across continents, encompassing peoples of countless tongues and traditions. But conquest alone is not enough. To create a legacy that will endure for a thousand years, we must transform our war machine into an imperial civilization. The conquered must be integrated, the trade routes secured, and a new world order established with the Great Khan at its center."
 mr_dominance.130.a: "Let the new era begin!"

 mr_dominance.131.title: "The New World Order"
 mr_dominance.131.desc: "Having conquered vast territories across Asia, the Mongol Empire is now consolidating its gains. Trade routes are being reorganized, imperial bureaucracies established, and the diverse peoples of the conquered lands are being systematically integrated into the Mongol imperial system. A new era of global politics is dawning."
 mr_dominance.131.a: "The world will never be the same."

 mr_dominance.135.title: "The Four Corners"
 mr_dominance.135.desc: "A rider can now leave the walls of Karakorum and change horses at imperial yams all the way to Dadu/Khanbaliq, to Samarkand, to Sarai — and never once cross a border. The four capitals of the old ulus answer to one standard for the first time since the empire broke apart.\n\nThe skeleton of the world empire stands. What remains is to give it flesh: the Persian cities, the Russian tribute, the roads beyond."
 mr_dominance.135.a: "Four corners, one sky, one Khan."

 mr_dominance.132.title: "The Eternal Empire"
 mr_dominance.132.desc: "It is done. The Mongol Empire has been transformed from a conquering horde into a permanent imperial civilization. Our institutions are robust, our trade networks span the known world, and the diverse peoples under our rule have been bound together into a single imperial identity. The Great Khan's legacy will echo through the ages, and the Mongol Age will never truly end."
 mr_dominance.132.a: "We have built something eternal."

 mr_dominance.133.title: "The Empire Crumbles"
 mr_dominance.133.desc: "Our imperial project has failed. The strains of governing such a vast and diverse empire proved too great. Corruption spreads through our administration, conquered peoples rise in rebellion, and our once-unstoppable military has grown complacent. The dream of a lasting Mongol world order slips through our fingers."
 mr_dominance.133.a: "All empires fall eventually."

 # --- The AI railroad war events (PD pd_brandenburg.103/203 pattern) ---
 mr_dominance.997.title: "The Kurultai Demands War"
 mr_dominance.997.desc: "The preparations are complete. The chosen rival has been isolated, the scouts have mapped every camp and pasture, and the warriors grow restless in the saddle. The Kurultai has spoken: the steppe can have only one master. The time has come to ride."
 mr_dominance.997.a: "For the Eternal Blue Sky! Declare war!"
 mr_dominance.997.b: "We are not ready yet. Let the horses fatten... (Postpone)"

 mr_dominance.993.title: "The Horde Rides for the Silk Road"
 mr_dominance.993.desc: "The corridor lies open. Our scouts have ridden the caravan roads from the Ordos to Transoxiana and returned with the same report: the power we have chosen is weaker than it looks, and its allies are far away. The wealth of the Silk Road belongs to whoever dares to take it — and the horde is ready to ride."
 mr_dominance.993.a: "The road belongs to the Khan! Declare war!"
 mr_dominance.993.b: "Let the caravans pass a while longer... (Postpone)"

 mr_dominance.992.title: "The Ulus Calls for Riders"
 mr_dominance.992.desc: "The old empire had four corners, and one of them is still missing. The chosen target holds land that answered to the Great Khan once and will answer again. The tumens are assembled, the remounts are fat, and the way has been scouted. One more ride, and the map is whole."
 mr_dominance.992.a: "Restore the ulus! Declare war!"
 mr_dominance.992.b: "The empire can wait a season more... (Postpone)"

