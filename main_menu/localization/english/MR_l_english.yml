 STATIC_MODIFIER_NAME_MR_imperial_conquest: "Imperial Conquest (Terminator)"
 STATIC_MODIFIER_DESC_MR_imperial_conquest: "The Mongol war machine is operational and hungry for conquest. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_empire_fulfilled: "The Yeke Mongol Ulus Restored"
 STATIC_MODIFIER_DESC_MR_empire_fulfilled: "The Great Mongol State stands again, proclaimed from Karakorum to Transoxiana. What Chinggis Khaan built and his grandsons divided answers once more to a single Khaghan. #G (Permanent.)#!"
 STATIC_MODIFIER_NAME_MR_imperial_failure_ai: "Shackled Empire"
 STATIC_MODIFIER_NAME_MR_imperial_failure_player: "Failed Imperial Dream"
 STATIC_MODIFIER_NAME_MR_mongol_preparing_for_conquest: "Mongol War Preparations"
 STATIC_MODIFIER_DESC_MR_mongol_preparing_for_conquest: "The horde musters under the Khan's command. It will strike when — and only when — the Kurultai commands it. #color_red (AI only: removed when the current Situation ends.)#!"

 # --- Situation 3 ---
 STATIC_MODIFIER_NAME_MR_pax_mongolica: "Pax Mongolica (Terminator)"
 STATIC_MODIFIER_DESC_MR_pax_mongolica: "The Mongol peace has been established, bringing stability and prosperity. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_mongol_world_order: "Mongol World Order"
 STATIC_MODIFIER_DESC_MR_mongol_world_order: "The world has been permanently reshaped by Mongol dominance."
 STATIC_MODIFIER_NAME_MR_dominance_failure_ai: "Collapsed Hegemony"
 STATIC_MODIFIER_NAME_MR_dominance_failure_player: "Failed World Order"

 # --- Historical Mode ---
 STATIC_MODIFIER_NAME_MR_mongol_historical_modifier: "Mongol Awakening"
 STATIC_MODIFIER_DESC_MR_mongol_historical_modifier: "The warrior spirit of the steppe stirs once more. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_mongol_historical_modifier_2: "Master of the Steppe"
 STATIC_MODIFIER_DESC_MR_mongol_historical_modifier_2: "The steppe answers to one banner, but greater ambitions wait beyond it. #G (Permanent.)#!"
 STATIC_MODIFIER_NAME_MR_imperial_historical_modifier: "Imperial Awakening"
 STATIC_MODIFIER_DESC_MR_imperial_historical_modifier: "The Mongol empire expands with historical momentum. #color_red (This effect will be removed upon the completion of the current Situation.)#!"
 STATIC_MODIFIER_NAME_MR_dominance_historical_modifier: "Mongol Hegemony"
 STATIC_MODIFIER_DESC_MR_dominance_historical_modifier: "The Mongol Empire dominates the world stage. #color_red (This effect will be removed upon the completion of the current Situation.)#!"

 # --- The Great Khan (character modifier, Timur-style, Immortality Modifier) ---
 STATIC_MODIFIER_NAME_MR_great_khan: "The Scourge of the Steppe"
 STATIC_MODIFIER_DESC_MR_great_khan: "This ruler carries the Borjigin blood and the will of Chinggis. The clans follow wherever the horsetail standard points."
 STATIC_MODIFIER_NAME_MR_chinggisid_blitz: "The Chinggisid Blitz"
 STATIC_MODIFIER_DESC_MR_chinggisid_blitz: "The horde does not besiege, negotiate and withdraw. What the tumens ride over is theirs the moment the last defender falls. #color_red (First Great Khan only — the later generations must take their conquests at the peace table.)#!"
 STATIC_MODIFIER_NAME_MR_historically_needed: "Historically Needed"
 STATIC_MODIFIER_DESC_MR_historically_needed: "This ruler is essential for the historical progression of the Mongol Resurgence."

 # --- Event-Specific Rewards ---
 STATIC_MODIFIER_NAME_MR_forge_of_warriors: "The Forge of Warriors"
 STATIC_MODIFIER_DESC_MR_forge_of_warriors: "The tumens drill as they did under the old banners: ten, a hundred, a thousand, ten thousand."
 STATIC_MODIFIER_NAME_MR_sacred_capital_restored: "The Sacred Capital Restored"
 STATIC_MODIFIER_DESC_MR_sacred_capital_restored: "Karakorum answers to the horsetail standard again. The Khan holds a capital now, not a camp. #G (Permanent — but lost if Karakorum is lost.)#!"
 STATIC_MODIFIER_NAME_MR_the_ulus_endures: "The Ulus Endures"
 STATIC_MODIFIER_DESC_MR_the_ulus_endures: "Written law, counted taxes, cast cannon, governors who stay where they are sent. The steppe survived its ending by becoming something else. #G (Permanent.)#!"
 STATIC_MODIFIER_NAME_MR_the_centre_cannot_hold: "The Centre Cannot Hold"
 STATIC_MODIFIER_DESC_MR_the_centre_cannot_hold: "The couriers still ride and the seals are still honoured, but the answers come slower every year and some of them no longer come at all. #Y (Lifted when the Great Partition ends.)#!"
 STATIC_MODIFIER_NAME_MR_the_uluses_drift: "The Uluses Drift"
 STATIC_MODIFIER_DESC_MR_the_uluses_drift: "The ulus khans keep the forms — the tribute, the horsetail standard, the name in the prayer — and keep the armies. A Khaghan who summons them now finds out how many will come. #Y (Lifted when the Great Partition ends.)#!"
 STATIC_MODIFIER_NAME_MR_khaghan_in_name_only: "Khaghan in Name Only"
 STATIC_MODIFIER_DESC_MR_khaghan_in_name_only: "What is left is a title, a city and the men who can still be paid. Every Chinggisid realm ended here, and none of them ended by being conquered. #Y (Lifted when the Great Partition ends.)#!"
 STATIC_MODIFIER_NAME_MR_ulus_of_its_own: "An Ulus of Its Own"
 STATIC_MODIFIER_DESC_MR_ulus_of_its_own: "The first generation after the break: every man in the saddle knows exactly whose banner he is under and why, and the old overlord's tumens are a long way from home. #G (25 years.)#!"
 STATIC_MODIFIER_NAME_MR_kurultai_defied: "The Kurultai Defied"
 STATIC_MODIFIER_DESC_MR_kurultai_defied: "The assembly asked and was refused. The uluses remain on the map and their khans remain in their tents, counting."
 STATIC_MODIFIER_NAME_MR_kurultai_mandate: "The Kurultai's Mandate"
 STATIC_MODIFIER_DESC_MR_kurultai_mandate: "The assembled chieftains have proclaimed our supremacy over all Mongol peoples by the old law of the steppe."
 STATIC_MODIFIER_NAME_MR_western_ulus_restored: "The Western Ulus Restored"
 STATIC_MODIFIER_DESC_MR_western_ulus_restored: "The horde stands on Russian soil again, and the western pastures remember their old masters."
 STATIC_MODIFIER_NAME_MR_seal_of_chinggis: "The Seal of Chinggis"
 STATIC_MODIFIER_DESC_MR_seal_of_chinggis: "The imperial seal of the Great Khans confers a legitimacy no rival claim can match."
 STATIC_MODIFIER_NAME_MR_volga_pastures: "The Volga Pastures"
 STATIC_MODIFIER_DESC_MR_volga_pastures: "A Mongol power is camped on a European river for the first time since Sarai fell."
 STATIC_MODIFIER_NAME_MR_dzungar_legacy: "The Dzungar Legacy"
 STATIC_MODIFIER_DESC_MR_dzungar_legacy: "Written law, counted taxes, cast cannon: the steppe has survived its ending by becoming something else."


