 # DHE timeline entries — terse headline style, per vanilla
 # flavor_tim ("Death of Timur").
 mr_history.1.entry: "Red Turbans and the Fall of the Yuan"
 mr_history.2.entry: "The Ilkhanate's Heirs"
 mr_history.3.entry: "The Chagatai Schism"
 mr_history.5.entry: "Tokhtamysh Reunites the Horde"
 mr_history.6.entry: "The Sack of Delhi"
 mr_history.7.entry: "The Oirat Challenge"
 mr_history.8.entry: "Babur Turns South"

 mr_history.1.title: "The Last Stand of the Yuan"
 mr_history.1.desc: "The Mandate of Heaven slips from our grasp. Red Turban banners rise across the southern provinces, the granaries stand empty, and the Yellow River has broken its banks once more. Our ancestors rode from the steppe and took the greatest empire on earth in a single lifetime; their descendants now sit in Dadu/Khanbaliq counting the provinces they have lost this season.\n\nThe court speaks of restoration. The generals speak of retreat to the grasslands. Both may be right, and neither will save the dynasty."
 mr_history.1.a: "China is lost. The steppe remains."
 mr_history.1.b: "The Mandate can still be held!"

 mr_history.2.title: "The Ilkhanid Succession"
 mr_history.2.desc: "Abu Sa'id died two years ago without an heir, and Hulagu's realm died with him. What remains is us and our rivals — Jalayirid, Chobanid, Muzaffarid, Injuid, Gurgan — each holding a corner of Persia and a claim none of the others accept.\n\nBaghdad, which our grandfathers took at the cost of a caliphate, is now a prize to be haggled over by men who could not have held a wing of the old army. Whoever wins this will inherit an Ilkhanate in name only."
 mr_history.2.a: "Hulagu's house has fallen. Ours will replace it."

 mr_history.3.title: "The Chagatai Schism"
 mr_history.3.desc: "The ulus splits along a line older than the Mongols themselves: the settled west against the nomadic east. In Transoxiana the emirs have taken to cities, to Islam, and to Persian scribes. In Moghulistan the clans still winter in tents and swear by the Eternal Blue Sky.\n\nEach half calls the other faithless. Both are right, by their own lights, and the choice before us will decide which half we belong to."
 mr_history.3.a: "The faith of the cities. Let us take the Word."
 mr_history.3.b: "The sky is our roof, as it was our fathers'."

 mr_history.5.title: "Tokhtamysh and the Golden Horde"
 mr_history.5.desc: "After a generation of murdered khans, the Jochid ulus has a master again. Tokhtamysh has reunited the White and Blue Hordes, and Sarai al-Jadid stirs with the traffic of a capital rather than the sullenness of a prize.\n\nBut the man who lifted him to the throne was Timur, and the debt is neither forgotten nor forgivable. There is not room on this steppe for both a Jochid restoration and a Chagatai conqueror."
 mr_history.5.a: "The Horde is whole. Let Sarai be great again."
 mr_history.5.b: "Timur will come. We will be ready for him."

 mr_history.6.title: "The Looting of Delhi"
 mr_history.6.desc: "The Sultanate's elephants broke on our lines, and the richest city in the world lay open before an army that had ridden across a subcontinent to reach it. For three days Delhi was emptied of everything that could be carried and many things that could not.\n\nThe masons and the stonecutters ride north with us in chains; Samarkand will be built from what Delhi lost. It will take the Sultanate a century to remember what it was."
 mr_history.6.a: "Let the caravans north be heavy with it."

 mr_history.7.title: "The Oirat Challenge"
 mr_history.7.desc: "The western Mongols have never accepted that the Borjigin blood alone confers the right to rule. Now the Oirat confederation puts the question directly: descent from Chinggis, or the loyalty of those who can actually field horsemen?\n\nEsen and his kin have the second in abundance. Whoever answers this challenge will hold the steppe; whoever fails it will be remembered as the last of a line."
 mr_history.7.a: "Let it be settled in the saddle."
 mr_history.7.b: "There is a way to bind them that does not cost us an army."

 mr_history.8.title: "The Mughal Precursor"
 mr_history.8.desc: "A young Timurid prince has lost Samarkand for the third time, and with it any prospect of holding his inheritance in Transoxiana. The Uzbeks have taken what his great-great-grandfather built.\n\nBabur turns south instead, toward Kabul and the passes beyond. Men are already saying that a throne lost on the steppe may yet be found in Hindustan."
 mr_history.8.a: "If not Samarkand, then somewhere greater."
 mr_history.8.b: "Transoxiana is not lost while a Timurid lives."

 mr_history.9.title: "The City of Ashes"
 mr_history.9.desc: "For three days the conqueror's army emptied Delhi of everything that could be carried and burned much of what could not. The treasury is gone, the mints are gone, the masons and stonecutters ride north in chains to build another man's capital.\n\nThe Sultanate survives in name. What survives in fact is a ring of provinces that no longer answer to a court that could not protect its own capital, and a city that will count its recovery in generations."
 mr_history.9.a: "We will rebuild. We have no other choice."

 # --- Historical context boxes ---
 mr_history.1.historical_info: "The Yuan were driven from Dadu/Khanbaliq in 1368 by the Ming founder Zhu Yuanzhang. The court withdrew to the steppe and continued to claim the Mandate of Heaven for another two centuries as the Northern Yuan."
 mr_history.2.historical_info: "Abu Sa'id Bahadur Khan died in 1335 without a successor. Within twenty years the Ilkhanate had dissolved into the Jalayirid, Chobanid, Muzaffarid and Sarbadar successor states."
 mr_history.3.historical_info: "The Chagatai Khanate split in the 1340s. Transoxiana in the west Islamised and settled; Moghulistan in the east kept to nomadic tradition. It was from the western half that Timur emerged in 1370."
 mr_history.5.historical_info: "Tokhtamysh reunited the White and Blue Hordes around 1380 with Timur's backing, then turned on his patron. Timur's campaigns of 1391 and 1395 broke the Golden Horde's power permanently."
 mr_history.6.historical_info: "Timur sacked Delhi in December 1398. The Delhi Sultanate never fully recovered, and northern India fragmented for over a century afterwards."
 mr_history.7.historical_info: "Under Esen Taishi the Oirats dominated the eastern steppe and, at Tumu in 1449, captured the Ming Zhengtong Emperor. Esen's claim to the khanate without Borjigin descent broke precedent, and after his death in 1455 the confederation collapsed."
 mr_history.8.historical_info: "Babur lost Samarkand three times to the Uzbeks before turning south. He took Kabul in 1504 and, after Panipat in 1526, founded the Mughal Empire — the Timurid line reborn in India."
 mr_history.9.historical_info: "Timur's army sacked Delhi in December 1398 after the Battle of Delhi. Contemporary accounts describe the city as depopulated for years; the Sayyid dynasty that followed controlled little beyond the city walls, and the Sultanate never recovered its former reach."

 # ==============================================================================
 # ----------------- LATE-STEPPE EVENTS (mr_steppe) -----------------
 # ==============================================================================

 mr_steppe.1.title: "The Last Great Khan"
 mr_steppe.1.desc: "Ligdan Khan of the Chahar wears the seal of Chinggis and calls himself lord of all Mongols. Few of them agree.\n\nHe has the bloodline and the seal, and almost nothing else — the eastern clans drift toward the rising Manchu power in Mukden, and the western Oirats never accepted Borjigin supremacy in the first place. He intends to compel them all. The question is whether a claim can outlive the horsemen willing to enforce it."
 mr_steppe.1.historical_info: "Ligdan Khan (r. 1604-1634) was the last Great Khan of the Mongols descended from Chinggis. His attempts to reunify the clans by force pushed most of them to ally with the Manchus instead. He died of smallpox fleeing west in 1634, and his son surrendered the imperial seal to Hong Taiji the following year."
 mr_steppe.1.a: "The seal of Chinggis compels obedience."
 mr_steppe.1.b: "A claim is worth what our riders can enforce."

 mr_steppe.2.title: "The Emperor in a Tent"
 mr_steppe.2.desc: "Word has come from the south that the Son of Heaven himself is a prisoner in a Mongol camp. The Ming court is paralysed, its generals discredited, its frontier garrisons leaderless.\n\nWhatever else is true of the settled empires, they are not invulnerable. Every chieftain who hesitated to ride with us has heard the same news."
 mr_steppe.2.historical_info: "At Tumu in 1449 the Oirat leader Esen Taishi destroyed a Ming army and captured the Zhengtong Emperor. The Ming enthroned his brother rather than pay, and Esen eventually released the emperor for nothing."
 mr_steppe.2.a: "Then the walls can be broken after all."

 mr_steppe.3.title: "The Seal Changes Hands"
 mr_steppe.3.desc: "The contest for the Mongolian heartland is settled. One banner now flies from the Kherlen to the Gobi, and the clans that spent a generation playing rivals against each other have run out of rivals to play.\n\nWhat that banner does next is the only question left on the steppe."
 mr_steppe.3.historical_info: "In actual history the seal passed to the Manchus in 1635, and the Mongol imperial line ended. The Qing ruled the steppe for the next two and a half centuries."
 mr_steppe.3.a: "The heartland is ours."

 mr_steppe.10.title: "The Road West"
 mr_steppe.10.desc: "The Torghut clans have had enough of Dzungaria. The pastures are contested, the Khoshut press from one side and the Choros from the other, and to the west there is a great river valley that no horde has held since Sarai fell.\n\nTheir chief speaks of loading the carts and not stopping until the grass changes. It is two thousand miles. It has been done before, in the other direction."
 mr_steppe.10.historical_info: "Between 1616 and 1630 roughly 200,000 Torghut Kalmyks migrated from Dzungaria to the lower Volga, one of the last great steppe migrations. They established a khanate on Russia's southern flank that lasted until 1771, when most of them attempted the return journey."
 mr_steppe.10.a: "Load the carts. We ride until the grass changes."
 mr_steppe.10.b: "Let them go. The pastures will be quieter."

 mr_steppe.11.title: "Across the Urals"
 mr_steppe.11.desc: "The column has crossed the stone belt. Behind it lies Dzungaria and the quarrels it was leaving; ahead lie the salt steppes and, beyond them, the river.\n\nRussian outposts watch the passage and send riders north with the news. Nobody moves to stop it. Nobody is quite sure how."
 mr_steppe.11.historical_info: "The migration route ran north of the Aral Sea and across the Kazakh steppe. The Kazakhs and Nogais resisted the passage; Russia, whose frontier forts were thin on the ground, mostly recorded it."
 mr_steppe.11.a: "The stone belt is behind us."

 mr_steppe.12.title: "Horsemen on the Volga"
 mr_steppe.12.desc: "Our southern voivodes report a nation on the move — not a raid, not a war band, but carts, herds, women and children, tens of thousands of them, settling onto pasture we had begun to think of as ours.\n\nThey came from the east, as such things always do. The last time this happened the reckoning lasted two hundred and forty years."
 mr_steppe.12.historical_info: "Russia ultimately accommodated the Kalmyks, granting them the Volga pastures in exchange for military service against the Crimean Tatars and Ottomans. Kalmyk cavalry fought in Russian armies through to the Napoleonic wars."
 mr_steppe.12.a: "Raise the frontier levies. This will not be a second yoke."
 mr_steppe.12.b: "Better such horsemen serving us than raiding us."

 mr_steppe.13.title: "The Grass Has Changed"
 mr_steppe.13.desc: "The carts have stopped. The herds are on the Volga pasture, the felt tents are up, and for the first time since Sarai burned there is a Mongol power camped on a European river.\n\nThe elders say the ancestors rode this way once and turned back at the wrong moment. This time nobody is turning back."
 mr_steppe.13.historical_info: "The Kalmyk Khanate on the Volga endured from the 1630s to 1771. It was the westernmost Mongol state ever established, and the only one to survive into the modern era — their descendants remain in Kalmykia today, Europe's only Buddhist-majority region."
 mr_steppe.13.a: "Pitch the tents. We are home."

 mr_steppe.20.title: "The Choros Ascendant"
 mr_steppe.20.desc: "With the Torghuts gone west and the Khoshut drawn south into Tibet, the Choros are left holding Dzungaria alone — and find that they prefer it.\n\nErdeni Batur is building something the steppe has not seen in three centuries: a khanate with fixed towns, cast cannon, a written code of law, and a standing army that does not disperse after the campaigning season."
 mr_steppe.20.historical_info: "Erdeni Batur founded the Dzungar Khanate around 1634 and convened the 1640 assembly that produced the Mongol-Oirat Code. The Dzungars were the last nomadic empire to seriously threaten a settled great power, holding out against the Qing until their destruction in 1755-58."
 mr_steppe.20.a: "The last horde will not be a horde at all."

 mr_steppe.21.title: "Cannon on the Steppe"
 mr_steppe.21.desc: "The foundries at Kobdo are casting guns, and Swedish and Russian deserters are teaching our smiths to bore them true. The Tarim oases pay grain, the caravan routes pay silver, and both together pay for powder.\n\nOur ancestors won with the bow because nothing on earth could answer it. That advantage is gone. This one we had to build."
 mr_steppe.21.historical_info: "The Dzungars manufactured their own gunpowder weapons, aided by a captured Swedish artilleryman, Johan Gustaf Renat. They were the only steppe power ever to industrialise its own firearms production."
 mr_steppe.21.a: "Let the foundries run day and night."

 mr_steppe.22.title: "The Last Steppe Empire"
 mr_steppe.22.desc: "From the Tarim to the western steppe, one authority holds — with laws written down, taxes counted, garrisons that stay put, and artillery that answers artillery.\n\nThe age of the horse archer is over everywhere. Here, alone, the steppe has survived its ending by becoming something else."
 mr_steppe.22.historical_info: "At its height the Dzungar Khanate controlled Dzungaria, the Tarim Basin, and much of the Kazakh steppe. Its destruction by the Qianlong Emperor in 1755-58 was so complete that historians describe it as genocide, and it marked the definitive end of nomadic power in Eurasia."
 mr_steppe.22.a: "The steppe endures, in a new shape."

 # --- The shared MGO/MGE advance line + the Yassa reform (2026-07-30) ---
 mr_legacy_of_the_yassa: "Legacy of the Yassa"
 mr_legacy_of_the_yassa_desc: "The Great Yassa of Chinggis Khan was never a book to be read but a discipline to be lived — succession settled by kurultai, loyalty rewarded above lineage, the herds and the army counted as one. Restoring its authority tells every tribe that this empire remembers what made the first one."
 mr_horse_lords_reborn: "Horse Lords Reborn"
 mr_horse_lords_reborn_desc: "A generation grew up inside walls. Put them back in the saddle: the compound bow drilled from childhood, the remount herds rebuilt, the feigned retreat practiced until it is instinct again."
 mr_yam_riders: "Riders of the Yam"
 mr_yam_riders_desc: "The Yam relay once carried a rider from the Danube to Karakorum faster than any rumor. Rebuilt, it feeds our armies before they hunger and remounts them before they slow — distance itself becomes our weapon again."
 MR_yassa_code: "The Yassa Code"
 MR_yassa_code_desc: "The law of the steppe, written down at last — one code over horde and settled land alike, binding khan and herdsman, general and governor."
 MR_the_keshig_system: "The Keshig System"
 MR_the_keshig_system_desc: "More than mere bodyguards, the Keshig are the iron core of the khanate. By raising the banners of our finest horsemen, we forge an unbreakable vanguard whose thundering hooves shall dictate the fate of empires."

 # --- Flavor wave 1 (envoys / herds / paiza packs + inert court scaffold; 2026-07-30). House rule: ALL loc lives in THIS file — the per-pack files the generator drafts get folded here and deleted. ---
 STATIC_MODIFIER_NAME_MR_defiance_of_the_south: "Defiance of the South"
 STATIC_MODIFIER_NAME_MR_eyes_westward: "Eyes Westward"
 mr_envoys.1.title: "The Ming Embassy"
 mr_envoys.1.desc: "Envoys in silk arrive from the south with the manner of men addressing a defeated province. Their master, having driven the sons of Kubilai from the throne of China, invites the Khan to accept the place of a tributary and the peace of the new order."
 mr_envoys.1.entry: "A Ming embassy demands submission"
 mr_envoys.1.historical_info: "From the 1370s the early Ming court sent repeated embassies to the Northern Yuan demanding formal submission; the exiled court refused the claim and went on styling itself the legitimate empire — a diplomatic contest that outlived both first generations."
 mr_envoys.1.a: "The Khan of Khans bows to no one."
 mr_envoys.1.b: "Take the gifts. Promise nothing they can hold."
 mr_envoys.1.c: "Melt their seals into stirrups."
 mr_envoys.2.title: "Timur and the Khan"
 mr_envoys.2.desc: "Word comes west across the passes: a lord of Transoxiana, lame in one leg and terrible in war, is stacking thrones like firewood. His letters are courteous. His armies are not. Two powers of the steppe now measure one another across a distance neither trusts."
 mr_envoys.2.entry: "Timur's shadow reaches the steppe"
 mr_envoys.2.historical_info: "Timur corresponded with, sponsored, and finally broke the khans of the western steppe — Tokhtamysh, his one-time protege, saw the Golden Horde's cities burned in 1395-96 for challenging him. He styled himself kuregen, son-in-law of the house of Chinggis, his entire reign."
 mr_envoys.2.a: "Courtesy between conquerors. For now."
 mr_envoys.2.b: "Return his envoys shaved. Let him come."
 mr_envoys.2.c: "A Chinggisid bride for the Gurkani — at a price he will remember."
 mr_herds.1.title: "Zud — the Killing Winter"
 mr_herds.1.desc: "The autumn rain froze where it fell, and the grass sleeps under a hand's width of ice the herds cannot break. The old men name it before the first camp does: zud. What the summer built, this winter means to take."
 mr_herds.1.entry: "A zud winter grips the steppe"
 mr_herds.1.historical_info: "The zud — an ice-locked or snow-heavy winter that starves livestock by the million — was the recurring catastrophe of steppe pastoralism, and driving the surviving herds toward the settled south in its wake was a standing cause of frontier war."
 mr_herds.1.a: "Slaughter early: salt the meat, sell the hides."
 mr_herds.1.b: "Endure. The Eternal Sky gives, and takes, and gives again."
 mr_herds.1.c: "When the steppe starves, the steppe rides."
 mr_paiza.1.title: "The Paiza and the Ortoq"
 mr_paiza.1.desc: "Merchant houses of Samarkand and Kashgar petition the court: grant them the khan's tablet — the paiza that opens every relay station and waves aside every toll — and in return the caravan silver flows to the treasury before it flows anywhere else."
 mr_paiza.1.entry: "Merchant houses petition for paizas"
 mr_paiza.1.historical_info: "Under the Yuan, ortoq merchant partnerships operated on capital advanced by Mongol princes, their privileges signified by the paiza tablet — a system that enriched the court, and whose abuses periodically forced it to cancel the tablets altogether."
 mr_paiza.1.a: "Grant the tablets. Let the silver flow."
 mr_paiza.1.b: "The khan's trade rides with the khan's own clans."
 mr_paiza.100.title: "The Ortoq's Bill"
 mr_paiza.100.desc: "The tablets have multiplied, and so have the debts sworn in the khan's name. Relay masters feed merchant trains larger than tumens; herdsmen carry the cost. The court must decide what its own seal is worth."
 mr_paiza.100.entry: "The ortoq system presents its costs"
 mr_paiza.100.historical_info: "Yuan emperors repeatedly banned and restored ortoq privileges as the partnerships' tax farming and usury bred resentment — the paiza system proved as fiscally addictive as it was politically corrosive."
 mr_paiza.100.a: "Cancel the concessions. The seal is not for sale."
 mr_paiza.100.b: "The silver must flow."
 mr_paiza.100.c: "Seize the ledgers, the tablets, and the silver both."
 STATIC_MODIFIER_NAME_MR_way_of_the_lama: "The Way of the Lama"
 STATIC_MODIFIER_NAME_MR_eternal_sky: "The Eternal Sky"
 STATIC_MODIFIER_NAME_MR_path_of_the_qadis: "The Path of the Qadis"
 mr_court.1.title: "The Return of Bayan"
 mr_court.1.desc: "An old man rides in from the ruined south with a train of clerks, seal-cutters, and account books strapped mule-back. He served the throne of Dadu while there was one; he offers what survived its fall — the knowledge of how an empire is counted, taxed, and held."
 mr_court.1.entry: "The exile court's chancellor reaches the steppe"
 mr_court.1.historical_info: "When Toghon Temür fled north in 1368, the remnant Yuan court carried its chancery into exile. This event imagines its ablest survivor reaching the reunifying horde — the administrative continuity the historical Northern Yuan largely failed to keep."
 mr_court.1.a: "A tent, a seal, and the ear of the Khan."
 mr_court.1.b: "The steppe needs no ink-brush ministers."
 mr_court.2.title: "The Karakorum Debate"
 mr_court.2.desc: "In the shadow of the rebuilt walls the court convenes the old contest: lamas with their wheels, shamans with their drums, qadis with their books, each to argue the sky's true shape before the Khan. Whatever is decided in the tent tonight, the empire will lean that way for a generation."
 mr_court.2.entry: "The faiths contend before the Khan"
 mr_court.2.historical_info: "Möngke Khan staged formal disputations between Buddhists, Christians, Muslims and shamanists at Karakorum in 1254. Two centuries on, the eastern Mongols turned to the dharma under Altan Khan while the western hordes had long since taken the qibla — the debate names the empire's real fork."
 mr_court.2.a: "Let the lamas speak last."
 mr_court.2.b: "The Eternal Sky needs no temples."
 mr_court.2.c: "The qadis argue well."

 # ==============================================================================
 # NEWS FROM THE EAST - the world beyond the conquest
 # ==============================================================================
 # Three beats to the outer ring, escalating the way the news actually
 # travelled: rumour, then an envoy, then a border. Audience is
 # mr_distant_observer - the parts of the world that historically heard of the
 # Mongols, and not one league further.
 mr_distant.1.title: "A Rumour Out of the East"
 mr_distant.1.desc: "The caravans come thinner now, and later, and the men who lead them will not stop talking. Somewhere beyond the last road they know, the tribes of the steppe have taken one banner again - and the name they give the man who holds it is one our grandfathers were taught to fear.\n\nMerchants exaggerate. They always have. But they all exaggerate the same way this year, and the ones who have come furthest say the least."
 mr_distant.1.a: "Old names, told by frightened men."
 mr_distant.2.title: "The Khan's Envoys"
 mr_distant.2.desc: "They did not ask for an audience. They rode to the gate, waited to be brought in, and delivered what they had been sent to deliver, in a tone suggesting they had said it before and would not be saying it twice.\n\n#I By the strength of the Eternal Sky. This is an order sent to you. Wherever you may be, submit to us and come to serve us, and we shall know your submission. And if you do not - what do we know? God knows.#!\n\nThey are already mounted, waiting for a reply we are not sure we can give."
 mr_distant.2.a: "Let them carry silence back with them."
 mr_distant.2.historical_info: "The wording is close to Guyug Khan's reply to Pope Innocent IV, carried west by Giovanni da Pian del Carpine in 1246. The Mongols wrote to everyone in that voice, and to them it was not a threat but a statement of the order of the world."
 mr_distant.3.title: "No Longer a Rumour"
 mr_distant.3.desc: "The reports have stopped disagreeing with each other, which is how we know they are true. The empire of the steppe stands on the roads to Persia and to the Levant, and the powers that stood between us and it stand there no longer.\n\nThere is nothing to decide yet. There is only the fact, and however long we have to look at it before it becomes our own frontier."
 mr_distant.3.a: "Then we had best learn their roads."
 mr_distant.3.historical_info: "This is the moment the West stopped writing about the Mongols as a wonder and began writing about them as a problem: Baghdad fell in 1258, Ain Jalut was fought in 1260, and Kose Dag had already broken the Seljuks of Rum in 1243."

 # --- the named blows -----------------------------------------------------
 # Fired on the claimant actually holding the ground, not on a timer.
 mr_distant.5.title: "The Mandate Changes Hands"
 mr_distant.5.desc: "Khanbaliq has fallen, and with it the seat from which the east was governed and through which half of it was fed. The couriers who brought the news had been riding for months and did not know whether the city still stood by the time they arrived.\n\nThe steppe is not raiding any more. It is collecting taxes."
 mr_distant.5.a: "Then the east has a master again."
 mr_distant.5.historical_info: "Zhongdu fell to Chinggis in 1215 and Khanbaliq became the Yuan capital in 1264. For everyone from Korea to Java it was the same message: these are not raiders, they are a government."
 mr_distant.4.title: "Baghdad"
 mr_distant.4.desc: "The House of Wisdom is ash and the Caliph is dead - rolled in a carpet and ridden over, they say, because the Mongols would not spill the blood of a king on the ground.\n\nFive hundred years of the caliphate ended inside a single week. Whatever else is written of this century, this is the page it will be opened at."
 mr_distant.4.a: "God is not mocked. But the city is gone."
 mr_distant.4.historical_info: "Hulegu took Baghdad in February 1258 and al-Musta'sim, the last Abbasid caliph in the city, was executed without bloodshed in the Mongol manner. The news travelled to Cairo, to Constantinople and to Rome, and it was not received with regret everywhere."
 mr_distant.6.title: "The Rus Lands Burn"
 mr_distant.6.desc: "City after city, and the same account of each: a demand for a tenth of everything, a refusal, and then nothing left to send an account about. The princes did not stand together and were not given a second chance to.\n\nThere is no longer anything between them and us that we would call a country."
 mr_distant.6.a: "Then it is our roads they ride next."
 mr_distant.6.historical_info: "Ryazan fell in 1237, Vladimir in 1238, Kiev in 1240. Legnica and Mohi followed in 1241, and that summer Frederick II wrote to every crowned head in the West while the Pope called a council about it."
 mr_distant.7.title: "The Roads Are Open"
 mr_distant.7.desc: "An odd consequence of a single empire: there is now one set of tolls between here and the eastern ocean, one safe-conduct that is honoured the whole way, and one law on the road that is enforced without interest in who you are.\n\nOur merchants have noticed before our councils have. Some of them are already gone."
 mr_distant.7.a: "Send someone we can trust to look."
 mr_distant.7.historical_info: "The Pax Mongolica was real and brief. Rubruck reached Karakorum in 1254, the Polos reached Khanbaliq in 1275, Ibn Battuta crossed nearly the whole of it, and a Yuan embassy under Rabban Bar Sauma reached Rome and Paris in 1287."
