 MR_MGO_SCORE_TT_DESC: "Score: Calculated with a weighted formula based on military strength, income, and prestige."
 MR_MGE_SCORE_TT: "Progress: [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('MR_mge_score').GetValue|0]%"
 MR_MGE_MILITARY_STRENGTH_TT_TITLE: "Great Khan's Military Strength"
