l_english:

 # ==============================================================================
 # MONGOL RESURGENCE - LOCALIZATION (single file, main_menu-loaded)
 # ==============================================================================
 # Vanilla and PD load ALL localization from main_menu/localization/<language>;
 # in_game/localization holds only the engine's jomini fallback. The mod
 # previously split its loc across two same-named files (in_game + main_menu),
 # which shadowed the main_menu copy in-game and left rule_/setting_/modifier
 # keys unresolved. Everything now lives here.

 # ==============================================================================
 # ----------------- SITUATION NAMES & DESCRIPTIONS -----------------
 # ==============================================================================
 # The situation list itself localizes as <key> + <key>_desc (vanilla:
 # situations_l_english.yml, black_death). The situation_*_title/_desc keys
 # below them are referenced directly by the mod's .gui panels.

 mongol_resurgence: "Mongol Resurgence"
 mongol_resurgence_desc: "$situation_mongol_resurgence_desc$"
 mongol_imperial: "Road to Empire"
 mongol_imperial_desc: "$situation_mongol_imperial_desc$"
 mongol_dominance: "The Four Khanates"
 mongol_dominance_desc: "$situation_mongol_dominance_desc$"
 mr_great_partition: "The Great Partition"
 mr_great_partition_desc: "$situation_mr_great_partition_desc$"
 mr_chahar_reunification: "The Chahar Reunification"
 mr_chahar_reunification_desc: "Ligdan Khan of the Chahar, last Great Khan of the Chinggisid line, is trying to bring the fractured Mongol clans back under a single banner by force. The eastern clans drift toward the rising Manchu power, and the western Oirats never accepted Borjigin supremacy in the first place. A claim is worth what the horsemen behind it can enforce."
 mr_torghut_migration: "The Torghut Migration"
 mr_torghut_migration_desc: "The Torghut clans have had enough of Dzungaria's contested pastures. Two thousand miles to the west lies a great river valley that no horde has held since Sarai fell. The carts are being loaded for the last great migration of the steppe: across the Kazakh steppe, over the Urals, to the Volga."
 mr_dzungar_khanate: "The Dzungar Khanate"
 mr_dzungar_khanate_desc: "With the Torghuts gone west and the Khoshut drawn south into Tibet, the Choros hold Dzungaria alone. Erdeni Batur is building something the steppe has not seen in three centuries: a khanate with fixed towns, cast cannon, a written code of law, and a standing army that does not disperse after the campaigning season."

 situation_mongol_resurgence_title: "Mongol Resurgence"
 situation_mongol_resurgence_desc: "The old steppe has gone silent. The once-mighty hordes that thundered across continents have been reduced to scattered tribes, bickering over pastures and petty alliances. The warrior spirit of Chinggis Khaan seems lost to the winds.\n\nBut in this chaos lies opportunity. One ambitious leader can rise from obscurity, unite the warring clans, and remind the world why their ancestors once trembled at the sound of hoofbeats. The road to empire begins with a single tent, a single banner, and a single will to dominate.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nThis situation depicts the chaotic struggle for dominance among the fractured Mongol successor states. Historically, the Mongol Empire fragmented after the death of Möngke Khaan in 1259, leading to centuries of internal strife and external pressures. A new unification will require crushing rival khans, absorbing their hordes, and proving absolute supremacy on the steppe.\n\n#Y What to Expect:#! The AI will opportunistically target weaker rival khans, building up its military might and tribal authority. Expect calculated wars of unification rather than mindless blobbing. The victor will emerge as the undisputed master of the Mongolian heartland, ready to look beyond the steppe."

 situation_mongol_imperial_title: "Road to Empire"
 situation_mongol_imperial_desc: "The steppe is united, but the Mongol destiny demands more. Our ancestors did not stop at the edge of the grasslands; they carved an empire that stretched from the Pacific to the Danube. The world forgot the taste of fear, but we shall remind them.\n\nNow begins the true test. We must transform our tribal confederation into a proper imperial machine, capable of sustained conquest across vast distances. The road ahead is paved with the bones of those who thought themselves safe behind walls and rivers.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nAfter Genghis Khan united the Mongol tribes in 1206, he didn't rest. He immediately turned outward, conquering the Jin Dynasty, the Khwarezmian Empire, and laying the foundation for the largest contiguous land empire in history. Similarly, our unified Mongol state will now look beyond the steppe.\n\n#Y What to Expect:#! The AI will aggressively expand into neighboring regions, prioritizing the Silk Road corridor from north China through Xinjiang to Transoxiana, and pressing north-east into Manchuria and south into Tibet, as the Yuan did. Expect large-scale invasions, calculated sieges, and the systematic dismantling of regional powers. The empire that emerges will be a true terror to behold."

 situation_mr_great_partition_title: "The Great Partition"
 situation_mr_great_partition_desc: "The Yeke Mongol Ulus stands from the Danube to the Yellow Sea, and it has stood long enough that the men who built it are dead. What holds it together is a name, a bloodline and a courier network, and the uluses on its edges have begun to count how far Karakorum really is.\n\nNo outside army will bring this empire down. It will come apart the way every Chinggisid realm came apart: at a succession, along the lines the conquest itself drew.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nMoengke Khan died in 1259 with the empire completely intact, and it split anyway. Berke, Hulagu, Kublai and Ariq Boeke each held their ulus firmly and separated regardless: the Chinggisid world never fell to an invader, it divided at the succession. This situation runs the conquest in reverse along the same lines.\n\n#Y What to Expect:#! Cohesion falls as uluses slip from the Khaghan's realm, and each successor breaks away at its own threshold, ordered by distance from Karakorum — Crimea first, Dzungaria last. The heartland never secedes; the empire ends when Karakorum itself leaves the Khaghan's realm, or when cohesion falls below 40 and the uluses have simply stopped answering. What emerges is the map that actually existed around 1700: the Kazakh Khanate, the Dzungars, Crimea, the Nogai, the Bashkirs and Chagatai in the Tarim, with Russia and the Manchu taking the edges."
 situation_mongol_dominance_title: "The Four Khanates"
 situation_mongol_dominance_desc: "The Yeke Mongol Ulus has been proclaimed. From the Sea of Japan to Transoxiana, the Mongol banner flies unchallenged — but the old empire had four corners, and three of them are still missing their masters.\n\nNow the final phase begins. The domains of the Golden Horde on the Volga, the Ilkhanate in Persia and Mesopotamia, and the roads into Rus and Anatolia must all answer to the Great Khan again. The Mongol Age will not be a brief moment in history; it will be the foundation of a new world order.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nAt its height, the Mongol Empire was divided among four khanates: the Yuan in China, the Chagatai in Transoxiana, the Golden Horde on the Volga, and the Ilkhanate in Persia. Hulagu's riders sacked Baghdad in 1258 and broke the Seljuks at Kose Dag in 1243 — the deepest the horde ever rode into Anatolia. This phase restores that map.\n\n#Y What to Expect:#! The AI will press westward — against the Russian principalities, the Volga khanates, and the powers of Persia and Mesopotamia — until the seats of all four khanates, all of Persia, and footholds in Rus and Cappadocia are under the imperial banner — while in the east it finishes what the Yuan began, taking the rest of China as the Song fell in 1279 and binding Korea as a [subject|e]."

 # ==============================================================================
 # ----------------- SITUATION HINTS -----------------
 # ==============================================================================
 # Convention: hint_<key> + hint_<key>_hint_text (vanilla hints_l_english.yml).

 hint_mongol_resurgence: "The Northern Yuan Resurgence"
 hint_mongol_resurgence_hint_text: "A struggle for the Chinggisid claim has begun on the Mongolian steppe. Whoever unites the clans and holds #Y Karakorum and the Gobi#! before #Y 1420#! takes up the mantle of the Great Khan.\n\nIf you rule a Mongol steppe horde, the situation grants you a #Y Unification of the Steppe#! casus belli against your rivals."
 hint_mongol_imperial: "The Pax Mongolica"
 hint_mongol_imperial_hint_text: "The unified horde turns outward. The Silk Road corridor — #Y Khorasan, Xinjiang and North China#! — must answer to the Khan before #Y 1550#!.\n\nThe situation grants the claimant the #Y Mastery of the Silk Road#! casus belli against the powers holding the corridor. The moment the corridor is mastered, the #Y Yeke Mongol Ulus#! — the Mongol Empire — is proclaimed."
 hint_mongol_dominance: "The Four Khanates"
 hint_mongol_dominance_hint_text: "The final act: the empire is proclaimed, and now it must be made whole. Before #Y 1650#! the Yeke Mongol Ulus must hold the #Y seats of the four khanates#! — Karakorum and Dadu/Khanbaliq for the Yuan, Samarkand for the Chagatai, Sarai and Kazan for the Golden Horde, Tabriz and Baghdad for the Ilkhanate — clear #Y Persia#! of every foreign power, and plant its banner in the #Y Russian lands#! and in #Y Cappadocia#!."
 hint_mr_great_partition: "The Great Partition"
 hint_mr_great_partition_hint_text: "No Chinggisid empire ever held together, and this one will not either. The uluses walk out one by one, on the schedule history set, and #Y cohesion#! falls with every one that goes. Hold the realm together until #Y 1720#! and the Yeke Mongol Ulus endures; let cohesion fall below #Y 40#! and the empire is remembered rather than ruled. Neighbours are granted a casus belli against the Khaghan once the collapse is plain."
 hint_mr_chahar: "Ligdan Khan and the Chahar"
 hint_mr_chahar_hint_text: "The last Chinggisid Great Khan is trying to reunify the Mongol clans by force. The situation ends when one Mongol power holds #Y Karakorum#! and a foothold in North China — or when Ligdan's claim dies with him in #Y 1634#!."
 hint_mr_torghut: "The Torghut Migration"
 hint_mr_torghut_hint_text: "A Mongol horde is trekking west from Dzungaria toward the Volga. The situation ends once a steppe horde has crossed the Urals and taken #Y Sarai#! — or when the window closes in #Y 1630#!."
 hint_mr_dzungar: "The Dzungar Khanate"
 hint_mr_dzungar_hint_text: "The last steppe empire is being built in Dzungaria. Consolidate the khanate and hold #Y Dzungaria, the Tarim basin and Zhetysu#! before #Y 1650#!."

 # ==============================================================================
 # ----------------- MAP TOOLTIPS, END & TIMEOUT REQUIREMENTS -----------------
 # ==============================================================================

 mr_resurgence_map_tt: "#Y The Mongolian heartland.#! Whoever unites these pastures under one banner takes up the Chinggisid claim."
 mr_imperial_map_tt: "#Y The Silk Road corridor and the northern marches.#! North China, Xinjiang and Khorasan — mastery of the road between them is the making of the Pax Mongolica — together with Manchuria, where the Jin fell in 1234, Tibet, which submitted to the Great Khan a decade later, and the Siberian frontier beyond."
 mr_dominance_map_tt: "#Y The lost khanates and the Song lands.#! The Volga, Persia, Mesopotamia, the Russian lands and the road to Cappadocia — everything the old empire held in the west — and in the east the rest of China, which fell in 1279, with Korea bound to the Great Khan as it was in 1259."
 mr_chahar_map_tt: "#Y The Mongolian heartland.#! The last Chinggisid Great Khan is trying to bring these clans to heel by force."
 mr_torghut_map_tt: "#Y The road west.#! From Dzungaria across the Urals to the Volga — the last great migration of the steppe."
 mr_dzungar_map_tt: "#Y Dzungaria and the western steppe.#! The ground on which the last nomadic empire is being built."

 mr_resurgence_seats_tt: "The #Y Mongol Horde#! or its [subject|e] hold [ShowLocationName('karakorum')] and are present in both the [ShowAreaName('eastern_gobi_area')] and [ShowAreaName('western_gobi_area')] [area|e]"
 mr_p1_heartland_cleared_tt: "No power outside our realm holds [locations|e] in the [ShowRegionName('mongolia_region')] [region|e]"
 # --- End requirements: ONE short line per condition ---
 # The panel renders these as a checklist, one tick per custom_tooltip, so
 # each must be a single line. Vanilla's own end-condition tooltips are all
 # one compact sentence and none contains a newline.
 mr_imperial_seats_tt: "[ShowLocationName('samarkand')] and [ShowLocationName('dadu')] answer to us or to our [subject|e]"
 mr_p2_corridor_cleared_tt: "No power outside our realm holds [locations|e] in the [ShowRegionName('khorasan_region')] or [ShowRegionName('xinjiang_region')] [region|e]"
 mr_p2_north_china_cleared_tt: "No power outside our realm holds [locations|e] in the [ShowRegionName('north_china_region')] [region|e]"
 mr_p2_northern_marches_cleared_tt: "No power outside our realm holds [locations|e] in [ShowRegionName('manchuria_region')], [ShowRegionName('tibet_region')] or the Siberian marches: [ShowAreaName('bursol_area')], [ShowAreaName('omsk_area')] and [ShowAreaName('kulykol_area')] [area|e]"
 mr_dominance_seats_tt: "The seven khanate seats — [ShowLocationName('karakorum')], [ShowLocationName('dadu')], [ShowLocationName('samarkand')], [ShowLocationName('sarai_al_jadid')], [ShowLocationName('kazan')], [ShowLocationName('tabriz')] and [ShowLocationName('baghdad')] — answer to us or to our [subject|e]"
 mr_dominance_russian_foothold_tt: "We or our [subject|e] hold at least one [location|e] in the [ShowRegionName('russian_region')] [region|e]"
 mr_dominance_cappadocia_tt: "We or our [subject|e] hold at least one [location|e] in the [ShowAreaName('cappadocia_area')] [area|e]"
 mr_p3_persia_cleared_tt: "The Ilkhanate restored: no power outside our realm holds [locations|e] in the [ShowRegionName('persia_region')] [region|e]"
 mr_p3_pontic_cleared_tt: "The Golden Horde's march: no power outside our realm holds [locations|e] in the [ShowRegionName('steppes_region')] or [ShowRegionName('caucasus_region')] [region|e]"
 mr_p3_volga_cleared_tt: "The middle Volga: no power outside our realm holds [locations|e] in the [ShowAreaName('kazan_area')], [ShowAreaName('bolghar_area')] or [ShowAreaName('bashkiria_area')] [area|e]"
 mr_p3_mesopotamia_cleared_tt: "No power outside our realm holds [locations|e] in the [ShowAreaName('iraq_arabi_area')] [area|e]"
 mr_p3_song_china_cleared_tt: "The Song lands, which fell in 1279: no power outside our realm holds [locations|e] in [ShowRegionName('east_china_region')], [ShowRegionName('west_china_region')] or [ShowRegionName('south_china_region')]"
 mr_p3_korea_in_the_fold_tt: "[ShowRegionName('korea_region')] answers to us or to our [subject|e] — Goryeo submitted in 1259 and was never annexed"

 mr_resurgence_timeout_tt: "#Y Or 1420 arrives.#! If the steppe is not united by then, the moment has passed."
 mr_imperial_timeout_tt: "#Y Or 1550 arrives.#! The Silk Road will not wait forever."
 mr_partition_khaghan_gone_tt: "#R The Khaghan is gone from the map.#! There is no centre left to hold anything."
 mr_partition_heartland_lost_tt: "#R [ShowLocationName('karakorum')] has slipped from the Khaghan's realm.#! An empire that cannot hold its own seat is a memory with an army."
 mr_partition_cohesion_spent_tt: "#R The uluses have gone their own way and the Khaghan's writ no longer reaches past [ShowRegionName('mongolia_region')].#! Cohesion below 40."
 mr_partition_timeout_tt: "#Y Or 1720 arrives.#! The steppe has outlived its own ending; whatever stands then, stands."
 mr_partition_map_tt: "This is ulus ground — one of the successors that will inherit if the centre fails."
 mr_dominance_timeout_tt: "#Y Or 1650 arrives.#! The age of the horse archer ends with or without us."
 mr_chahar_timeout_tt: "#Y Or 1634 arrives.#! Ligdan's claim dies with him."
 mr_chahar_end_tt: "A #Y Mongol#! power holds [ShowLocationName('karakorum')] and is present in the [ShowRegionName('north_china_region')] [region|e]"
 mr_torghut_end_trek_tt: "The great trek has crossed the #Y Urals#!"
 mr_torghut_end_volga_tt: "A #Y Mongol#! steppe horde holds [ShowLocationName('sarai_al_jadid')] on the Volga"
 mr_dzungar_end_beat_tt: "The khanate is consolidated at home — #Y fixed towns, written law, a standing army#!"
 mr_dzungar_end_hold_tt: "A #Y Mongol#! steppe horde is present in the [ShowAreaName('dzungaria_area')], [ShowAreaName('tarim_area')] and [ShowAreaName('zhetysu_area')] [area|e]"
 mr_torghut_timeout_tt: "#Y Or 1630 arrives.#! The trek ends where it ends."
 mr_dzungar_timeout_tt: "#Y Or 1650 arrives.#!"

